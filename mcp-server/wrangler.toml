# CARR MCP server — Cloudflare Worker (skeleton deployed 2026-07-30)
# Secrets (via `wrangler secret put`, never in this file, never in git):
#   DATABASE_URL_READER — Neon login role granted carr_reader (views only)
#   DATABASE_URL_WRITER — Neon login role granted carr_writer (write path; set when verbs land)
#   DATABASE_URL_GATE_ZERO_WRITER
#                       — Neon login role carr_gate_zero_producer, created by
#                         migration 0502 and granted NOTHING else. It is
#                         the ONLY role holding EXECUTE on
#                         ops.gate_zero_record_read_only_outcome (migration 0502
#                         revokes it from carr_writer), and the record layer
#                         derives the producing seat from session_user rather
#                         than from any session setting — standing-rule
#                         amendment 9, 2026-09-14: seat-only write is enforced by
#                         CONNECTION ROLE. Used by exactly one verb,
#                         record-gate-zero-read-only-outcome, and by nothing else;
#                         never widen it and never point it at app_writer.
#                         THIS SECRET IS ONE OF A FAMILY. It moves together with
#                         DATABASE_URL_READER and DATABASE_URL_WRITER, because a
#                         Worker holding the new value of one and the old value
#                         of another authenticates as the wrong identity. The
#                         family is therefore published in ONE atomic bulk call
#                         and read back, never one `wrangler secret put` at a
#                         time. Production role credentials remain managed by
#                         the operator outside this deployment workflow.
#   PROBE_TOKENS        — JSON map { "<slug>": "<token>" } for the smoke suite ONLY
#                         (loop #192, 2026-08-06). Authenticates as one locked-
#                         profile machine actor ('smoke-probe'); checked in
#                         index.js before the OAuthProvider ever sees the request.
#                         See secrets-inventory.md and mcp-server/smoke-reads.sh's
#                         header for the provisioning runbook.
#   REVIEW_TOKENS       — JSON map { "<slug>": "<token>" } for the Automatic Review
#                         Council (built 2026-08-06). Same shape and same
#                         before-the-OAuthProvider check as PROBE_TOKENS, modeled
#                         directly on it. Authenticates a reviewer actor
#                         ('codex-reviewer', 'grok-reviewer') locked server-side to
#                         the 'reviewer' profile: ALL reads + EXACTLY record-finding.
#                         TWO KEYS as of the 2026-08-06 scope extension — Codex was
#                         the original frozen scope; Grok joined the same day once
#                         its subscription-covered headless path (OAuth device
#                         flow, no XAI_API_KEY) was live-verified. Paste both keys
#                         together: {"codex-reviewer":"<t1>","grok-reviewer":"<t2>"}.
#                         See pipelines/provision-review-council.sql and
#                         bin/review-council-runner.sh for the provisioning runbook.
#                         PROVISIONED AND ACTIVE as of 2026-08-06 (#214 audit,
#                         verified live: both reviewer actors exist, active=t).
#   LOCAL_TOKENS        — JSON map with one key per local machine door:
#                         { "joe-local": "<t1>", "dell-local": "<t2>" }.
#                         Joe's door began Phase 1, 2026-08-13 (decision
#                         97e76a2f); Dell's separate sponsored door followed
#                         2026-08-18.
#                         Same shape and same before-the-OAuthProvider check as
#                         PROBE_TOKENS/REVIEW_TOKENS. Authenticates
#                         mcp-server/local-verb.mjs (via tools/call-verb.py /
#                         `run.sh call`) as the machine's own actor: joe-local
#                         sponsored to Joe, or dell-local sponsored to Dell
#                         (identity.js's LOCAL_SPONSOR); both are human:false
#                         with full verb parity minus humanOnly.
#                         This CLOSES the direct-database bypass local-verb.mjs
#                         used to run: it is now a thin HTTPS client of this
#                         Worker, same as any other caller. The direct-database
#                         path survives only as explicit, receipted break-glass
#                         — see local-verb.mjs's own header. Additive secret;
#                         never widen AGENT_TOKENS for this (see index.js's
#                         "local token" comment for why). Provisioning:
#                         pipelines/provision-local-client.sql for Joe or
#                         pipelines/provision-dell-local-client.sql for Dell
#                         (both mirror provision-smoke-probe.sql) + a key in
#                         ~/.config/carr/mcp-tokens.env (CARR_MCP_LOCAL_TOKEN).
#   HERMES_TOKENS       — JSON map for the locked Hermes runtime, including
#                         { "hermes-pilot": "<token>" }. The unattended room
#                         bridge selects the matching value from the same 600
#                         token file as CARR_HERMES_MCP_TOKEN only for its
#                         shape-checked project-room-queue calls. The plist and
#                         argv never carry the value; ordinary calls remain on
#                         CARR_MCP_LOCAL_TOKEN / joe-local.
#   HERMES_TOKENS_EXTRA — additive room-bridge projector map:
#                         { "hermes-pilot": "<new-token>" }. Never replace
#                         HERMES_TOKENS just to add this client: secret values
#                         cannot be read back, so replacement could invalidate
#                         the existing Hermes runtime.
#   HERMES_COS_TOKENS — separate JSON map for the server-locked Hermes
#                       chief-of-staff door, e.g. { "hermes-pilot": "<token>" }.
#                       This map is checked before HERMES_TOKENS and selects only
#                       the `hermes-cos` profile (ordinary Hermes/projector
#                       credentials remain on their existing profile). Joe
#                       provisions the secret value; it never appears here.
#                       Local proof uses CARR_MCP_CLIENT_PROFILE=hermes-cos and
#                       CARR_HERMES_COS_MCP_TOKEN in the existing 0600
#                       ~/.config/carr/mcp-tokens.env. It must never reuse
#                       CARR_HERMES_MCP_TOKEN / HERMES_TOKENS_EXTRA.
#                       Native Hermes Desktop is provisioned separately through
#                       its sanctioned CLI:
#                         hermes mcp add carr-cos \
#                           --url https://api.doctorcre.com/mcp --auth header
#                       Enter the same dedicated CoS bearer only at the prompt.
#                       Hermes stores it as MCP_CARR_COS_API_KEY in its 0600
#                       ~/.hermes/.env and stores only ${MCP_CARR_COS_API_KEY}
#                       interpolation in ~/.hermes/config.yaml. Post-merge:
#                         hermes config path; hermes config env-path
#                         stat -f %Lp ~/.hermes/.env ~/.hermes/config.yaml
#                         hermes mcp list; hermes mcp test carr-cos
#                       Both files must read 600, carr-cos must be enabled, and
#                       a fresh native session's tools/list must include
#                       update-deal/add-premises. The ordinary/projector server
#                       must remain distinct and must omit both verbs. Rollback:
#                         hermes mcp remove carr-cos
#                       then remove only MCP_CARR_COS_API_KEY through the Hermes
#                       credential owner; never edit or reuse the plain token.
#   (PARTNER_TOKENS     — RETIRED 2026-08-03. Was an interim per-partner bearer
#                         for /mcp during the OAuth rollout. Both partners are on
#                         provider-issued tokens; the secret is deleted and the
#                         code path is gone. Listed here only so the next reader
#                         of an old commit knows where it went. PROBE_TOKENS above
#                         is NOT its replacement — it authenticates as its own
#                         narrow machine actor, never as a full human actor.)
#   GOOGLE_CLIENT_ID    — Google Cloud OAuth 2.0 web client (upstream sign-in)
#   GOOGLE_CLIENT_SECRET— ditto. Joe sets both himself; Claude never holds them.
#   DATABASE_URL_OWNERSHIP_ISSUER_G1 / DATABASE_URL_OWNERSHIP_ISSUER_G2
#                         — generation-specific login URLs for the canonical
#                         ownership issuer capability.  The two slots are
#                         published independently and carry only one of the
#                         two login roles at a time: active or draining.
#                         They are intentionally absent from every local
#                         dispatcher environment.  WR126's provisioner is a
#                         dry-run planner only; it never reads or publishes
#                         these values.  The Worker lifecycle seam remains
#                         disabled until a separately accepted production
#                         change provisions and verifies the slots.
#   ENGINEERING_CONTROLLER_TOKENS
#                         — one isolated Worker bearer map for the registered
#                         Codex controller: {"codex":"<token>"}.  It opens
#                         only the four canonical-ownership MCP operations;
#                         it is not LOCAL_TOKENS, AGENT_TOKENS, or either
#                         generation-specific issuer slot.  No local model
#                         process receives this bearer.
name = "carr-mcp"
account_id = "12ccca77eb49142a6be8eb84c0d6a3a0"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Required by workers-oauth-provider for Client ID Metadata Document support:
# it disables the legacy same-zone fetch shortcut, which is the SSRF guard for
# fetching a client's metadata document.
compatibility_flags = ["global_fetch_strictly_public", "nodejs_compat"]

# Custom domains. api.* is the machine surface; reports.* is the isolated
# client-link surface routed through the same Worker so its digest-only exchange
# and reads remain same-origin. The apex stays free for the future public site.
# doctorcre.com added 2026-08-01 (Joe's domain ruling): PRIMARY name
# as of Dell's onboarding — practicecre.com stays live as an alias; its
# retirement is a later, unhurried decision. Same Worker answers both.
routes = [
  { pattern = "api.practicecre.com", custom_domain = true },
  { pattern = "api.doctorcre.com", custom_domain = true },
  { pattern = "dealroom.doctorcre.com", custom_domain = true },
  { pattern = "reports.doctorcre.com", custom_domain = true }
]

# Pinned OFL font binaries are bundled as private Worker data modules for the
# deterministic Tour PDF renderer. They are not served by the ASSETS binding.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

# /release reports the production identity stamped by the deployment workflow.
[vars]
CARR_ENV = "production"
APP_HOST = "app.doctorcre.com"
LEGACY_DEALROOM_HOST = "dealroom.doctorcre.com"
# A reviewed, public deployment setting. Program 6 is enabled only through the
# immutable release that fingerprints this exact config value; the shared
# parser still fails closed for a missing or non-literal value.
DEALROOM_PROGRAM6_ACTIONS_ENABLED = "true"
# Authenticated Command Center cutover: / serves workspace.html while enabled;
# /deals remains the explicit Deal Room route. Disable to roll back the root.
WORKSPACE_COMMAND_CENTER_READ_ENABLED = "true"
# Final half of the reviewed zero-downtime credential cutover. Dedicated Codex
# and Claude token maps and native profiles passed the isolated live lifecycle
# proof on the compatibility release, so this release requires surface-bound
# credentials. Absent or unknown values fail closed in index.js.
CONTINUITY_SURFACE_ENFORCEMENT = "required"
# Canonical ownership issuer lifecycle is deliberately inert in this source
# slice.  Keep the default explicit in both environments so a deploy cannot
# turn a credential plan into a production effect by omission.
CANONICAL_OWNERSHIP_RUNTIME_MODE = "disabled"
CANONICAL_OWNERSHIP_ISSUER_ACTIVE_GENERATION = "none"
CANONICAL_OWNERSHIP_CANARY_JOB_ID = "none"
# Cloudflare supplies the immutable version ID, optional tag, and creation
# timestamp at runtime. /release reads this binding as provider identity; it is
# deliberately separate from GIT_SHA, which is source provenance stamped by the
# deploy wrapper.
[version_metadata]
binding = "CF_VERSION_METADATA"

# One Worker + one asset binding is the smallest deployable structure. P2
# materializes the exact digest-pinned DoctorCRE release into this ignored path
# before Wrangler runs.
[assets]
directory = "../out/doctorcre-artifacts/current"
binding = "ASSETS"
run_worker_first = true

# OAuth grant/token storage for workers-oauth-provider. The binding name is
# fixed by the library — it reads env.OAUTH_KV directly. Created 2026-07-31.
# Secrets are stored only as hashes; grant props are encrypted at rest.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "b033d3b5c454445080e9d0ab51ff8f3c"

[[durable_objects.bindings]]
name = "OAUTH_CONSENT_STATE"
class_name = "OAuthConsentState"

[[migrations]]
tag = "oauth-consent-v1"
new_sqlite_classes = ["OAuthConsentState"]

[observability]
enabled = true

[[r2_buckets]]
binding = "carr_documents"
bucket_name = "carr-documents"

# ─────────────────────────────────────────────────────────────────────────────

[ai]
binding = "AI"
