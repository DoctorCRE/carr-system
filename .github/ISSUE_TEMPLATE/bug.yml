name: "Bug"
description: "Report a reproducible engineering defect."
labels: ["needs-triage", "type:bug"]
body:
  - type: markdown
    attributes:
      value: "PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references. This applies to the title, all fields, comments and attachments."
  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction"
      description: "Give minimal steps using synthetic data only. PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references."
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: "Expected and actual behavior"
      description: "Compare expected and actual engineering behavior, including version or commit. PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "Describe the engineering problem and its impact. PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "Desired outcome"
      description: "Describe the observable engineering result. PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Scope and exclusions"
      description: "State what this work includes and explicitly excludes. PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checklist"
      description: "Use stable IDs and observable checks. Keep IDs when editing criteria. PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references."
      value: "- [ ] AC-1: Observable engineering result and verification method"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "List public engineering issue references and contracts, or None. Never link identifying records. PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Opaque evidence references"
      description: "Use opaque record IDs only, or None. Keep evidence content in its authorized store; do not paste it here. PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references."
    validations:
      required: true
  - type: textarea
    id: legacy
    attributes:
      label: "Legacy WR ID"
      description: "Enter the legacy WR reference, such as WR-000675, or None for new work. PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references."
    validations:
      required: true
  - type: checkboxes
    id: public-data
    attributes:
      label: Public repository check
      options:
        - label: "I checked the title and body. PUBLIC repository. Include no client names, contacts, deal identifiers, document extracts, screenshots or identifying links. Engineering descriptions only, with opaque evidence references."
          required: true
