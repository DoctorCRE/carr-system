name: Backup freshness (cloud)

on:
  schedule:
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch: {}

concurrency:
  group: carr-backup-freshness
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require a qualified cloud artifact within the recovery objective
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/recovery-point.py --cloud-only --json
