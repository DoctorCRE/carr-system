name: Review gate
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    types: [checks_requested]
permissions: {contents: read}
concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: false
jobs:
  evaluate:
    permissions: {contents: read, pull-requests: read, statuses: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 ops/review-gate-selftest.py && python3 ops/review-gate.py
        env:
          GH_TOKEN: ${{ github.token }}
          CARR_REVIEW_APP_LOGIN: ${{ vars.CARR_REVIEW_APP_LOGIN }}
