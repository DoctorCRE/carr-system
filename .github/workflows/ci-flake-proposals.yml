name: CI flake proposals

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-flake-proposals
  cancel-in-progress: false

jobs:
  proposals:
    name: CI flake proposals
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Reconcile coalesced events from the last two days
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python ops/ci-flakes.py reconcile --repo "$REPOSITORY"
          --cache "$RUNNER_TEMP/ci-flake-logs"
