name: CI flake proposals

on:
  workflow_run:
    workflows: [CI, main canary]
    types: [completed]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-flake-proposals
  cancel-in-progress: false

jobs:
  proposals:
    name: CI flake proposals
    permissions:
      actions: read
      contents: read
      issues: write
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Propose same-tree failures as fix loops
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python ops/ci-flakes.py consume --repo "$REPOSITORY"
          --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT"
          --cache "$RUNNER_TEMP/ci-flake-logs"
      - name: Reconcile coalesced events from the last two days
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python ops/ci-flakes.py reconcile --repo "$REPOSITORY"
          --cache "$RUNNER_TEMP/ci-flake-logs"
