# Experimental, owner-preauthorized overnight merge lane. The three-job split is
# the security boundary: PR code receives a read-only token; only clean code from
# protected main receives pull-request write authority.

name: Overnight merge pilot

on:
  schedule:
    # 03:30 America/Chicago during daylight time, 02:30 during standard time.
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      execute:
        description: "Conditionally merge after the exact-SHA rehearsal"
        required: true
        type: boolean
        default: false

concurrency:
  group: carr-overnight-merge-pilot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan against current GitHub evidence
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CARR_AUTOMERGE_PILOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      pr_number: ${{ steps.plan.outputs.pr_number }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      merge_ref: ${{ steps.plan.outputs.merge_ref }}
      policy_digest: ${{ steps.plan.outputs.policy_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # LAYER 3 of the 2026-08-23 CI-failures council: no merge onto a red main.
      #
      # BEFORE the plan, because this is the cheap half. Without it the pilot
      # plans against a broken main and finds out in the 20-minute verify job,
      # having spent a Postgres service, two setup actions and a full strict
      # suite to learn something one API call already knew.
      #
      # IT REFUSES ON UNKNOWN TOO, and that is the council's kill criterion
      # honoured rather than dodged: Codex's bar was "kill any implementation
      # under which a skipped or neutral check accidentally satisfies branch
      # protection". An unattended overnight merge that cannot establish main is
      # green must not proceed on the strength of not having looked. Declining
      # costs one night; merging onto an unchecked base costs a morning.
      #
      # There is no force-green anywhere in this path. The canary going green is
      # the unfreeze — nothing to reset, and no flag that can stick.
      - name: Refuse to plan a merge while main is frozen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARR_MAIN_FREEZE: ${{ vars.CARR_MAIN_FREEZE }}
        run: python3 ops/main-canary-state.py --require-green

      - id: plan
        name: Select at most one exact-SHA candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PILOT_ENABLED: ${{ vars.CARR_AUTOMERGE_PILOT_ENABLED }}
        run: >-
          python3 ops/automerge_pilot.py plan
          --repo "$GITHUB_REPOSITORY"
          --enabled "$PILOT_ENABLED"
          --output automerge-plan-audit.json
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain the redacted plan ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automerge-plan-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: automerge-plan-audit.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Read-only exact merge-ref verification
    needs: plan
    if: ${{ needs.plan.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    # Keep the independent full-strict verification ceiling aligned with CI.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      independent_merge_sha: ${{ steps.parents.outputs.verified_merge_sha }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: carr_ci
          POSTGRES_PASSWORD: carr_ci
          POSTGRES_DB: carr_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.merge_ref }}
          fetch-depth: 2
          # THIS IS THE ONLY JOB THAT EXECUTES PULL-REQUEST CODE, so it is the
          # only one that must not be handed a credential. checkout stores the
          # job token in .git/config by default, and ops/ci.sh runs the PR's own
          # test files a few steps below — mcp-server/test/ is an allowed pilot
          # path, so that code is untrusted by construction. The token is scoped
          # to contents:read and cannot merge anything, but a read token that
          # leaves the runner is still a read token somebody else now holds.
          # Nothing in this job talks to the remote after the checkout.
          persist-credentials: false

      - id: parents
        name: Bind rehearsal merge to the planned base and head
        env:
          EXPECTED_BASE: ${{ needs.plan.outputs.base_sha }}
          EXPECTED_HEAD: ${{ needs.plan.outputs.head_sha }}
        run: >-
          python3 ops/automerge_pilot.py verify-checkout
          --expected-base "$EXPECTED_BASE"
          --expected-head "$EXPECTED_HEAD"
          --parents "$(git rev-list --parents -n 1 HEAD)"
          --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Install pinned Node dependencies
        run: npm --prefix mcp-server ci

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Create the Neon-compatible migration role
        env:
          PGPASSWORD: carr_ci
        run: |
          psql -h localhost -U carr_ci -d carr_ci -v ON_ERROR_STOP=1 -c \
            "do \$\$ begin
               if not exists (select 1 from pg_roles where rolname = 'neondb_owner') then
                 create role neondb_owner;
               end if;
             end \$\$;"

      - name: Independently rerun every strict check on the exact merge ref
        env:
          CARR_CI_DATABASE_URL: postgres://carr_ci:carr_ci@localhost:5432/carr_ci # ci-secret-scan: allow — throwaway loopback runner credential
          CARR_CI_PORTABLE_ONLY: "1"
        run: ops/ci.sh --strict

  merge:
    name: Conditional squash merge from protected main
    needs: [plan, verify]
    if: >-
      ${{ needs.verify.result == 'success' &&
          (github.event_name == 'schedule' || inputs.execute == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Re-read all evidence and conditionally merge the same SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PILOT_ENABLED: ${{ vars.CARR_AUTOMERGE_PILOT_ENABLED }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.plan.outputs.head_sha }}
          EXPECTED_BASE: ${{ needs.plan.outputs.base_sha }}
          POLICY_DIGEST: ${{ needs.plan.outputs.policy_digest }}
          INDEPENDENT_MERGE_SHA: ${{ needs.verify.outputs.independent_merge_sha }}
        run: >-
          python3 ops/automerge_pilot.py execute
          --repo "$GITHUB_REPOSITORY"
          --enabled "$PILOT_ENABLED"
          --pr-number "$PR_NUMBER"
          --expected-head "$EXPECTED_HEAD"
          --expected-base "$EXPECTED_BASE"
          --independent-merge-sha "$INDEPENDENT_MERGE_SHA"
          --expected-policy-digest "$POLICY_DIGEST"
          --output automerge-result-audit.json
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Retain the redacted merge ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automerge-result-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: automerge-result-audit.json
          if-no-files-found: error
          retention-days: 30
