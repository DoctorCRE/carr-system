name: MCP unit shards
on:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    if: ${{ !cancelled() }}
    name: MCP unit shard ${{ matrix.shard }} of 7
    runs-on: ubuntu-24.04
    container:
      options: --init
      image: ghcr.io/jbookout/software-factory/ci-postgres@sha256:2efca181e7962b7fed6a1184f88de14117d6c626f64f5cdb7afcb4bdccc461fa
    defaults:
      run:
        shell: bash
    env:
      CARR_CI_POSTGRES_IMAGE: both
      CARR_LOCAL_PG_ALLOW_HOSTED: "1"
      CARR_LOCAL_PG_BIN_DIR: /usr/lib/postgresql/17/bin
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
        env:
          POSTGRES_USER: carr_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carr_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carr_ci -d carr_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Prepare writable image Python environment
        run: |
          test "$(id -u)" = 1001
          python -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: ./.github/actions/ci-downloads

      - run: python -m pip install -r requirements.lock
      - run: npm --prefix mcp-server ci --no-audit
      - uses: ./.github/actions/ci-apt
        with:
          packages: --postgres --documents
      - name: Run assigned MCP suites
        env:
          CARR_CI_DATABASE_URL: postgres://carr_ci@postgres:5432/carr_ci
          PGPASSWORD: postgres
          CARR_CI_PORTABLE_ONLY: "1"
          CARR_LOCAL_PG_ALLOW_HOSTED: "1"
          CARR_LOCAL_PG_BIN_DIR: /usr/lib/postgresql/17/bin
          CARR_CI_PROGRAM_RECORDS: ${{ runner.temp }}/ci-programs.json
          CARR_CI_UNIT_SHARD: ${{ matrix.shard }}
          CARR_CI_UNIT_RECEIPT: ${{ runner.temp }}/unit-${{ matrix.shard }}.json
          LC_ALL: C
        run: ops/ci.sh --strict --only unit --unit-part mcp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-receipt-${{ matrix.shard }}
          path: ${{ runner.temp }}/unit-${{ matrix.shard }}.json
          if-no-files-found: error
      - name: Retain shard program records and failed diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-diagnostics-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/ci-programs.json
            ${{ runner.temp }}/carr-ci.*/*.log.redacted
          if-no-files-found: ignore
