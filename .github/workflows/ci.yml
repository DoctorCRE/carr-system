# Required CI always reports; ops/db-acceptance-scope.py owns database applicability.
name: CI

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    # 06:20 UTC daily. Sits after the nightly backup (02:35 UTC) and the 05:10
    # edge-liveness slot.
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide database proof applicability
        id: scope
        run: python3 ops/db-acceptance-scope.py --receipt db-scope.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-scope
          path: db-scope.json
          if-no-files-found: error

  classes:
    # Dispatch immediately; migration classifies locally with the same scope owner.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: ${{ matrix.gate_shard == 2 && matrix.job_names.gates_shard_2.name || matrix.job_names[matrix.classes].name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gate_shard: [1, 2]
        # 2026-10-01 run 36928008916: this combined group took 310s (unit
        # 228s, types 36s, secret 33s, other classes 13s), below ten minutes.
        # Keep gates and migration in separate jobs. Every class
        # must appear in exactly one group (ops/ci-selftest.py verifies this).
        classes:
          - "migration"
          - "pushfloor unit types contract secret binding artifact freshness"
          - "gates"
          - "hxprobe"
          - "dependency"
        job_names:
          - migration: {name: "ops/ci.sh --strict --only migration", classes: "migration"}
            "pushfloor unit types contract secret binding artifact freshness": {name: "ops/ci.sh --strict --only pushfloor unit types contract secret binding artifact freshness", classes: "pushfloor unit types contract secret binding artifact freshness"}
            gates: {name: "ops/ci.sh --strict --only gates", classes: "gates"}
            gates_shard_2: {name: "Gates selftests shard 2 of 2", classes: "gates"}
            hxprobe: {name: "ops/ci.sh --strict --only hxprobe", classes: "hxprobe"}
            dependency: {name: "ops/ci.sh --strict --only dependency", classes: "dependency"}
        # The second dimension partitions only gates; ready runs keep every class.
        exclude:
          - {classes: "dependency", gate_shard: 2}
          - {classes: "pushfloor unit types contract secret binding artifact freshness", gate_shard: 2}
          - {classes: "migration", gate_shard: 2}
          - {classes: "hxprobe", gate_shard: 2}
    timeout-minutes: ${{ matrix.classes == 'migration' && 45 || 20 }}

    services:
      postgres:
        image: ${{ contains(matrix.classes, 'unit') && 'pgvector/pgvector:0.8.7-pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84' || '' }}
        env:
          POSTGRES_USER: carr_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carr_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carr_ci -d carr_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Migration identity and historical snapshot proofs read pinned commits.
          fetch-depth: 0

      - name: Decide database proof applicability
        if: matrix.classes == 'migration'
        id: scope
        continue-on-error: true
        run: python3 ops/db-acceptance-scope.py --receipt db-scope.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.classes != 'migration' || steps.scope.outputs.full != 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            mcp-server/package-lock.json
            practice-plugin/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.classes != 'migration' || steps.scope.outputs.full != 'false'
        with:
          python-version-file: .python-version

      - name: Install Python dependencies from the lock
        if: matrix.classes != 'migration' || steps.scope.outputs.full != 'false'
        # The LOCK, not requirements.txt. requirements.txt is the loose
        # human-facing declaration; the lock is its pinned resolution, and
        # installing the lock is what makes this run reproducible. ci.sh's
        # dependency class separately refuses if the two have drifted.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      # ci verifies lock integrity; the strict dependency class owns npm audit.
      - name: Install Node dependencies
        if: matrix.classes != 'migration' || steps.scope.outputs.full != 'false'
        run: |
          npm --prefix mcp-server ci --no-audit
          npm --prefix practice-plugin ci --no-audit

      - name: Identify the runner image for the zsh archive
        if: matrix.classes != 'migration' || steps.scope.outputs.full != 'false'
        id: zsh-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore zsh package archives
        if: matrix.classes != 'migration' || steps.scope.outputs.full != 'false'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/zsh-debs/*.deb
          key: zsh-ubuntu24-${{ runner.arch }}-${{ steps.zsh-image.outputs.version }}-${{ hashFiles('ops/ci-zsh.sh') }}
      - name: Install zsh
        if: matrix.classes != 'migration' || steps.scope.outputs.full != 'false'
        # bin/review-council-runner.sh has a #!/bin/zsh shebang and its test
        # invokes it by that interpreter. Use the runner's installed shell
        # when available; otherwise try its indexes before refreshing them.
        # The download is the only step that depends on the Ubuntu mirror, so
        # it alone is retried (up to three bounded attempts, index refresh
        # once after the first miss). The unpack runs from the local cache and
        # has its own 120-second deadline, separate from download deadlines. Every process
        # is bounded; an unavailable package still fails the job, never skips
        # its tests. Budget: 3*65 + 65 + 125 + 15 = 400 seconds;
        # plus 60 seconds of overhead, rounded up, requires exactly 8 minutes.
        # Cached archives avoid mirror downloads on subsequent runs.
        timeout-minutes: 12
        env:
          ZSH_RETRY_BACKOFF: "5"
          ZSH_ARCHIVE_DIR: ${{ runner.temp }}/zsh-debs
        run: ops/ci-zsh.sh

      - name: Install PostgreSQL 17
        if: contains(matrix.classes, 'unit') || contains(matrix.classes, 'gates') || (matrix.classes == 'migration' && steps.scope.outputs.full != 'false')
        timeout-minutes: 5
        run: bash ops/ci-postgres.sh

      - name: Verify edge incident delivery
        if: matrix.classes == 'gates'
        run: python3 test/ci-noise-incident-test.py

      - name: Run this group's check classes
        env:
          # Excludes the checks whose dependency cannot exist on a runner
          # (installed Claude Code settings, macOS launchd). Each one prints its
          # reason in the output; nothing is dropped silently.
          CARR_CI_DATABASE_URL: ${{ contains(matrix.classes, 'unit') && 'postgres://carr_ci:postgres@localhost:5432/carr_ci' || '' }} # ci-secret-scan: allow - disposable loopback fixture
          GH_TOKEN: ${{ github.token }}
          CARR_CI_PORTABLE_ONLY: "1"
          CARR_LOCAL_PG_ALLOW_HOSTED: "1"
          CARR_LOCAL_PG_BIN_DIR: /usr/lib/postgresql/17/bin
          LC_ALL: C
        run: |
          if [ "${{ matrix.classes }}" = migration ]; then
            if [ "${{ steps.scope.outputs.full }}" = false ]; then
              echo "migration: not applicable; see db-scope receipt" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              python3 ops/migration-open-pr-gate.py
              python ops/local-pg-ci.py --class migration --migration-part proofs
            fi
          else
            if [ "${{ matrix.classes }}" = gates ]; then
              ops/ci.sh --strict --only gates --gate-shard "${{ matrix.gate_shard }}/2"
            else
              ops/ci.sh --strict --only "${{ matrix.classes }}"
            fi
          fi

  migration-fixtures:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.full != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Migration ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: [reconstruction, equivalence, shadow, gates-serial, gates-isolated, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install proof dependencies
        run: |
          python -m pip install -r requirements.lock
          npm --prefix mcp-server ci --no-audit
      - name: Install PostgreSQL 17
        timeout-minutes: 5
        run: bash ops/ci-postgres.sh

      - name: Prove independent migration fixture
        if: matrix.part != 'acceptance' && !startsWith(matrix.part, 'gates-')
        env:
          CARR_CI_PORTABLE_ONLY: "1"
          CARR_SHADOW_ARTIFACT_DIR: ${{ runner.temp }}/migration-shadow
        run: ops/ci.sh --strict --only migration --migration-part "${{ matrix.part }}"
      - name: Prove database programs on their own migrated cluster
        if: matrix.part == 'acceptance' || startsWith(matrix.part, 'gates-')
        env:
          CARR_CI_PORTABLE_ONLY: "1"
          CARR_LOCAL_PG_ALLOW_HOSTED: "1"
          CARR_LOCAL_PG_BIN_DIR: /usr/lib/postgresql/17/bin
        run: python ops/local-pg-ci.py --class migration --migration-part "${{ matrix.part }}"
      - name: Retain a regenerated schema on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-fixture-schema-${{ matrix.part }}
          path: ${{ runner.temp }}/migration-shadow/schema.sql
          if-no-files-found: ignore


  fallow:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Fallow (${{ matrix.root }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root: [mcp-server, practice-plugin, control-room, workspace]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install package dependencies when locked
        working-directory: ${{ matrix.root }}
        run: if [ -f package-lock.json ]; then npm ci --no-audit; fi
      - uses: fallow-rs/fallow@4f2657d30ad9639d1f8ec29f0bd5b9d48ee44f31 # v3.35.0
        with:
          version: '3.35.0'
          root: ${{ matrix.root }}
          command: audit
          only: dead-code,architecture,dupes
          dead-code-baseline: fallow-baselines/dead-code.json
          dupes-baseline: fallow-baselines/dupes.json
          artifacts-dir: fallow-results/${{ matrix.root }}

  checks:
    # THE REQUIRED CONTEXT. Its name is what the ruleset requires, so it must
    # report whatever the class jobs do: `always()` makes it run when
    # a group is red or cancelled, and the step below turns anything but
    # success into a red context. Without `always()` a failed group would
    # leave this job skipped, and a required check that never reports blocks
    # the merge silently instead of saying why.
    name: ops/ci.sh --strict
    runs-on: ubuntu-24.04
    needs: [scope, classes, migration-fixtures, fallow]
    permissions:
      contents: read
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Fail unless every class group succeeded
        env:
          CI_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 ops/ci-evidence.py verdict
      - name: Record the tested tree and class contract
        if: needs.scope.outputs.full != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
        run: python3 ops/ci-evidence.py record --output ci-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.scope.outputs.full != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
        with:
          name: ci-tree-evidence
          path: ci-evidence.json
          if-no-files-found: error
          overwrite: true
      # Check last: cancellation can arrive during checkout, verdict or upload.
      - name: Reject a cancelled run
        if: ${{ cancelled() }}
        run: |
          echo "CI verdict: run cancelled; no full-suite evidence"
          exit 1
