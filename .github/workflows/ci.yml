# Required CI always reports; ops/db-acceptance-scope.py owns database applicability.
name: CI

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    # 06:20 UTC daily. Sits after the nightly backup (02:35 UTC) and the 05:10
    # edge-liveness slot.
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide database proof applicability
        id: scope
        run: python3 ops/db-acceptance-scope.py --receipt db-scope.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-scope
          path: db-scope.json
          if-no-files-found: error

  classes:
    needs: scope
    if: ${{ !cancelled() }}
    name: ${{ matrix.gate_shard == 2 && 'Gates selftests shard 2 of 2' || format('ops/ci.sh --strict --only {0}', matrix.classes) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gate_shard: [1, 2]
        # 2026-10-01 run 36928008916: this combined group took 310s (unit
        # 228s, types 36s, secret 33s, other classes 13s), below ten minutes.
        # Keep gates and migration in separate jobs. Every class
        # must appear in exactly one group (ops/ci-selftest.py verifies this).
        classes:
          - "pushfloor unit types contract secret dependency binding artifact freshness"
          - "gates"
          - "migration"
          - "hxprobe"
        # The second dimension partitions only gates. Drafts keep their fast classes.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '[{"classes":"pushfloor unit types contract secret dependency binding artifact freshness","gate_shard":2},{"classes":"hxprobe","gate_shard":2},{"classes":"gates"},{"classes":"migration"}]' || '[{"classes":"pushfloor unit types contract secret dependency binding artifact freshness","gate_shard":2},{"classes":"migration","gate_shard":2},{"classes":"hxprobe","gate_shard":2}]') }}
    timeout-minutes: ${{ matrix.classes == 'migration' && 45 || 20 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # FULL HISTORY, for the freshness class only. actions/checkout defaults
          # to a depth of 1, which is why nothing here could ever have caught a
          # lost update: with no history there is no merge-base, so "has this
          # branch seen main's latest change to this file" is unanswerable. Every
          # other class reads the tree as it stands and does not care.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.classes != 'migration' || needs.scope.outputs.full != 'false'
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.classes != 'migration' || needs.scope.outputs.full != 'false'
        with:
          python-version-file: .python-version

      - name: Install Python dependencies from the lock
        if: matrix.classes != 'migration' || needs.scope.outputs.full != 'false'
        # The LOCK, not requirements.txt. requirements.txt is the loose
        # human-facing declaration; the lock is its pinned resolution, and
        # installing the lock is what makes this run reproducible. ci.sh's
        # dependency class separately refuses if the two have drifted.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Install Node dependencies
        if: matrix.classes != 'migration' || needs.scope.outputs.full != 'false'
        run: |
          npm --prefix mcp-server ci
          npm --prefix practice-plugin ci

      - name: Identify the runner image for the zsh archive
        if: matrix.classes != 'migration' || needs.scope.outputs.full != 'false'
        id: zsh-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore zsh package archives
        if: matrix.classes != 'migration' || needs.scope.outputs.full != 'false'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/zsh-debs/*.deb
          key: zsh-ubuntu24-${{ runner.arch }}-${{ steps.zsh-image.outputs.version }}-${{ hashFiles('ops/ci-zsh.sh') }}
      - name: Install zsh
        if: matrix.classes != 'migration' || needs.scope.outputs.full != 'false'
        # bin/review-council-runner.sh has a #!/bin/zsh shebang and its test
        # invokes it by that interpreter. Use the runner's installed shell
        # when available; otherwise try its indexes before refreshing them.
        # The download is the only step that depends on the Ubuntu mirror, so
        # it alone is retried (up to three bounded attempts, index refresh
        # once after the first miss). The unpack runs from the local cache and
        # has its own 120-second deadline, separate from download deadlines. Every process
        # is bounded; an unavailable package still fails the job, never skips
        # its tests. Budget: 3*65 + 65 + 125 + 15 = 400 seconds;
        # plus 60 seconds of overhead, rounded up, requires exactly 8 minutes.
        # Cached archives avoid mirror downloads on subsequent runs.
        timeout-minutes: 12
        env:
          ZSH_RETRY_BACKOFF: "5"
          ZSH_ARCHIVE_DIR: ${{ runner.temp }}/zsh-debs
        run: ops/ci-zsh.sh

      - name: Install PostgreSQL 17
        if: contains(matrix.classes, 'gates') || (matrix.classes == 'migration' && needs.scope.outputs.full != 'false')
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-18 postgresql-client-18
          /usr/lib/postgresql/17/bin/initdb --version
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Verify edge incident delivery
        if: matrix.classes == 'gates'
        run: python3 test/ci-noise-incident-test.py

      - name: Verify audit attempt and cache integrity
        if: matrix.classes == 'gates'
        run: python3 test/ci-failure-audit-test.py

      - name: Run this group's check classes
        env:
          # Excludes the checks whose dependency cannot exist on a runner
          # (installed Claude Code settings, macOS launchd). Each one prints its
          # reason in the output; nothing is dropped silently.
          GH_TOKEN: ${{ github.token }}
          CARR_CI_PORTABLE_ONLY: "1"
          CARR_LOCAL_PG_ALLOW_HOSTED: "1"
          CARR_LOCAL_PG_BIN_DIR: /usr/lib/postgresql/17/bin
          LC_ALL: C
        run: |
          if [ "${{ matrix.classes }}" = migration ]; then
            if [ "${{ needs.scope.outputs.full }}" = false ]; then
              echo "migration: not applicable; see db-scope receipt" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              python3 ops/migration-open-pr-gate.py
              python ops/local-pg-ci.py --class migration --migration-part core
            fi
          else
            if [ "${{ matrix.classes }}" = gates ]; then
              ops/ci.sh --strict --only gates --gate-shard "${{ matrix.gate_shard }}/2"
            else
              ops/ci.sh --strict --only "${{ matrix.classes }}"
            fi
          fi
      - name: Require a written pull request description
        if: ${{ github.event_name == 'pull_request' && matrix.classes == 'gates' }}
        run: python3 ops/pr-description-check.py

  migration-fixtures:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.full != 'false' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Migration isolated fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install proof dependencies
        run: |
          python -m pip install -r requirements.lock
          npm --prefix mcp-server ci
      - name: Install PostgreSQL 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-18 postgresql-client-18
          /usr/lib/postgresql/17/bin/initdb --version
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Prove reconstruction, production equivalence and base-schema shadow
        env:
          CARR_CI_PORTABLE_ONLY: "1"
          CARR_SHADOW_ARTIFACT_DIR: ${{ runner.temp }}/migration-shadow
        run: ops/ci.sh --strict --only migration --migration-part fixtures
      - name: Retain a regenerated schema on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-fixture-schema
          path: ${{ runner.temp }}/migration-shadow/schema.sql
          if-no-files-found: ignore


  checks:
    # THE REQUIRED CONTEXT. Its name is what the ruleset requires, so it must
    # report whatever the class jobs do: `always()` makes it run when
    # a group is red or cancelled, and the step below turns anything but
    # success into a red context. Without `always()` a failed group would
    # leave this job skipped, and a required check that never reports blocks
    # the merge silently instead of saying why.
    name: ops/ci.sh --strict
    runs-on: ubuntu-24.04
    needs: [scope, classes, migration-fixtures]
    permissions:
      contents: read
      actions: read
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Fail unless every class group succeeded
        env:
          DB_FULL: ${{ needs.scope.outputs.full }}
          FIXTURES_RESULT: ${{ needs.migration-fixtures.result }}
          CLASSES_RESULT: ${{ needs.classes.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$FIXTURES_RESULT" != success ] && ! { [ "$DB_FULL" = false ] && [ "$FIXTURES_RESULT" = skipped ]; }; then
            echo "migration fixtures: $FIXTURES_RESULT (database scope=$DB_FULL)"
            exit 1
          fi
          python3 ops/ci-evidence.py verdict
          if [ "$CLASSES_RESULT" != "success" ]; then
            echo "aggregate matrix result: $CLASSES_RESULT"
            exit 1
          fi
      - name: Record the tested tree and class contract
        if: needs.scope.outputs.full != 'false'
        run: python3 ops/ci-evidence.py record --output ci-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.scope.outputs.full != 'false'
        with:
          name: ci-tree-evidence
          path: ci-evidence.json
          if-no-files-found: error
          overwrite: true
