name: Instruction drift

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --prefix mcp-server --ignore-scripts
      - run: python -m pip install -r requirements.lock
      - run: python ops/doc-drift-product.py
      - run: python -m unittest discover -s test/doc_drift_product -v
      - name: Check changed instructions and their references
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            ./ops/ci.sh --doc-drift --base "$BASE_SHA"
          else
            ./ops/ci.sh --doc-drift
          fi
      - name: Remove unchecked values from the public artifact
        if: always()
        run: python ops/doc-drift-product.py --report out/doc-drift/report.json --output out/doc-drift/public-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: instruction-drift-report
          path: out/doc-drift/public-report.json
          if-no-files-found: error
      - name: Summarize drift and fail on stale claims beyond the baseline
        if: github.event_name != 'pull_request'
        run: >-
          python ops/doc-drift-product.py --report out/doc-drift/public-report.json
          --baseline scripts/doc-drift/baseline.json --summary "$GITHUB_STEP_SUMMARY"

  snapshot:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: schema-snapshot-refresh
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: bash ops/ci-postgres.sh
      - name: Refresh schema snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heads=$(gh api --paginate 'repos/{owner}/{repo}/pulls?state=open&per_page=100' --jq '.[].head.ref')
          if printf '%s\n' "$heads" | grep -q '^automation/schema-snapshot-'; then exit 0; fi
          python ops/migration-shadow.py --base HEAD --write
          git diff --quiet -- db/schema.sql && exit 0
          branch="automation/schema-snapshot-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git add db/schema.sql
          printf 'chore(db): refresh schema snapshot\n\nCo-Authored-By: Codex <noreply@openai.com>\n' > "$RUNNER_TEMP/snapshot-message"
          git -c user.name=jbookout -c user.email=jbookout@users.noreply.github.com commit -F "$RUNNER_TEMP/snapshot-message"
          git push origin "$branch"
          sleep 2
          printf 'Refresh main plus pending migrations on disposable PostgreSQL 18. The export restores with reviewed seeds and business-data isolation intact. Only db/schema.sql changes.\n\n## Design and debt pass\n- codebase-design preserves the existing rebuild interface.\n- zero-tech-debt adds no compatibility path.\n\nThis replaces the previous snapshot.\n' > "$RUNNER_TEMP/snapshot-body"
          git show --format= --numstat HEAD -- db/schema.sql | awk '{printf "Net lines (tests included): +%d / -%d, net %+d.\n", $1, $2, $1-$2}' >> "$RUNNER_TEMP/snapshot-body"
          gh pr create --base main --head "$branch" --title 'chore(db): refresh schema snapshot' --body-file "$RUNNER_TEMP/snapshot-body"
          sleep 2
          gh workflow run ci.yml --ref "$branch"
          sleep 2
          gh workflow run doc-drift.yml --ref "$branch"

  verdict:
    name: Instruction drift verdict
    needs: [check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require completed instruction-drift work
        env:
          CI_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 ops/ci-evidence.py drift-verdict
      # Check last: cancellation can arrive during checkout, verdict or upload.
      - name: Reject a cancelled run
        if: ${{ cancelled() }}
        run: |
          echo "CI verdict: run cancelled; no full-suite evidence"
          exit 1
