name: Verdict delivery
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize, labeled, unlabeled, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: verdict-delivery-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_sha || github.event.sha }}
  cancel-in-progress: false
jobs:
  deliver:
    if: >-
      github.repository == 'DoctorCRE/carr-system' &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      github.event.comment.user.login == vars.CARR_VERDICT_TRANSPORT_LOGIN))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - run: python3 -m pip install -r requirements.lock
      - name: Check service identity configuration
        id: configured
        env:
          APP_KEY: ${{ secrets.CARR_REVIEW_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '[{"state":"refused","reason":"Review App Actions key not configured"}]' > receipt.json
          fi
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        if: steps.configured.outputs.ready == 'true'
        id: app
        with:
          app-id: '5567205'
          private-key: ${{ secrets.CARR_REVIEW_APP_PRIVATE_KEY }}
          owner: DoctorCRE
          repositories: carr-system
      - name: Deliver verdict or evaluate native merge
        if: steps.configured.outputs.ready == 'true'
        run: python3 ops/verdict-delivery.py event > receipt.json
        env:
          GH_TOKEN: ${{ github.token }}
          CARR_REVIEW_APP_TOKEN: ${{ steps.app.outputs.token }}
          CARR_VERDICT_TRANSPORT_LOGIN: ${{ vars.CARR_VERDICT_TRANSPORT_LOGIN }}
          CARR_VERDICT_ARM_ENABLED: ${{ vars.CARR_VERDICT_ARM_ENABLED }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verdict-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
          retention-days: 30
