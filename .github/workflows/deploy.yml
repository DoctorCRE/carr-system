# Production deploy of the carr-mcp Worker and its database migrations.
# Runs only for a main commit whose "main canary" run (the full ops/ci.sh
# --strict classes on main) succeeded. ci.yml does not run on pushes to main,
# so the canary is that commit's CI.
name: deploy

on:
  workflow_run:
    workflows: [main canary]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_durable_object_migration:
        description: "Ship with a full deploy because wrangler.toml declares a Durable Object migration production has not applied"
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      ACCOUNT_ID: 12ccca77eb49142a6be8eb84c0d6a3a0
      RELEASE_URL: https://api.doctorcre.com/release
    steps:
      - name: Require both production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$PRODUCTION_DATABASE_URL" ] || missing="$missing PRODUCTION_DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Environment 'production' is missing secret(s):$missing. Nothing was deployed."
            exit 1
          fi

      - name: Require a successful main canary for a dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green="$(gh run list -R "$GITHUB_REPOSITORY" --workflow main-canary.yml --commit "$SHA" \
            --status success --json databaseId --jq length)"
          if [ "$green" = "0" ]; then
            echo "::error::main canary has not succeeded for $SHA. Wait for it, or re-run it, then dispatch again."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # The candidate sealer reads the commit's tree through git.
          fetch-depth: 0

      - name: Refuse to roll production back to an older commit
        run: |
          live="$(curl -fsS --max-time 20 "$RELEASE_URL" | jq -r '.git_sha.value // empty')"
          if [ -n "$live" ] && [ "$live" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$live" 2>/dev/null; then
            echo "::error::production already serves $live, which contains $SHA. Roll back with a revert on main, not by re-running an old deploy."
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies from the locks
        run: |
          python -m pip install -r requirements.lock
          npm --prefix mcp-server ci --no-audit

      - name: Apply pending database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: python tools/migrate.py --apply --yes

      - name: Materialize the pinned DoctorCRE app assets
        run: |
          python tools/release-manifest.py doctorcre-artifact materialize \
            --pin ops/config/doctorcre-artifact.v1.json --root out/doctorcre-artifacts
          test -f out/doctorcre-artifacts/current/workspace.html

      - name: Seal the candidate manifest and count verbs
        id: stamp
        run: |
          node --input-type=module -e '
            const { sealCandidateManifest } = await import(process.cwd() + "/mcp-server/bin/seal-candidate-manifest.mjs");
            const sealed = sealCandidateManifest(process.cwd(), process.env.SHA);
            if (/[\\\n]/.test(sealed.manifest_text)) throw new Error("manifest holds a backslash or newline");
            // wrangler-action splits `command` with @actions/exec, which unescapes only \" inside quotes.
            const arg = sealed.manifest_text.replaceAll("\"", "\\\"");
            const fs = await import("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `digest=${sealed.digest}\nmanifest_arg=${arg}\n`);
          '
          echo "verbs=$(sh ops/verb-count.sh mcp-server)" >> "$GITHUB_OUTPUT"

      - name: Check for an unapplied Durable Object migration
        id: do_migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/services/carr-mcp" > services.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, tomllib
          declared = [m["tag"] for m in tomllib.load(open("mcp-server/wrangler.toml", "rb")).get("migrations", [])]
          applied = json.load(open("services.json"))["result"]["default_environment"]["script"].get("migration_tag")
          if applied and applied not in declared:
              raise SystemExit(f"production applied Durable Object migration {applied!r}, which wrangler.toml does not declare")
          print(f"pending={'true' if declared and applied != declared[-1] else 'false'}")
          PY

      - name: Refuse an unapproved Durable Object migration
        if: steps.do_migration.outputs.pending == 'true' && !inputs.apply_durable_object_migration
        run: |
          echo "::error::wrangler.toml declares a Durable Object migration production has not applied. 'versions upload' cannot apply it. Check that the routes in mcp-server/wrangler.toml match production's custom domains, then run this workflow by hand with apply_durable_object_migration ticked."
          exit 1

      - name: Deploy with the Durable Object migration (100% of traffic)
        if: steps.do_migration.outputs.pending == 'true' && inputs.apply_durable_object_migration
        id: full_deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: mcp-server
          command: >-
            deploy --tag ${{ env.SHA }} --message "github-actions ${{ github.run_id }}"
            --var GIT_SHA:${{ env.SHA }}
            --var CANDIDATE_MANIFEST_DIGEST:${{ steps.stamp.outputs.digest }}
            --var "CANDIDATE_MANIFEST:${{ steps.stamp.outputs.manifest_arg }}"

      - name: Upload the version
        if: steps.do_migration.outputs.pending == 'false'
        id: upload
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: mcp-server
          command: >-
            versions upload --tag ${{ env.SHA }} --message "github-actions ${{ github.run_id }}"
            --var GIT_SHA:${{ env.SHA }}
            --var CANDIDATE_MANIFEST_DIGEST:${{ steps.stamp.outputs.digest }}
            --var "CANDIDATE_MANIFEST:${{ steps.stamp.outputs.manifest_arg }}"

      - name: Read the uploaded version id
        id: version
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}${{ steps.full_deploy.outputs.command-output }}
        run: |
          id="$(printf '%s\n' "$OUTPUT" | sed -nE 's/.*Version ID:[[:space:]]*([0-9a-f-]{36}).*/\1/p' | tail -n 1)"
          [ -n "$id" ] || { echo "::error::wrangler printed no Version ID; production traffic was not moved by this step."; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Promote the version to 100% of traffic
        if: steps.upload.outcome == 'success'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.ACCOUNT_ID }}
          workingDirectory: mcp-server
          command: >-
            versions deploy ${{ steps.version.outputs.id }}@100 --yes
            --message "github-actions ${{ github.run_id }} ${{ env.SHA }}"

      - name: Verify production serves this commit
        env:
          VERSION_ID: ${{ steps.version.outputs.id }}
          VERBS: ${{ steps.stamp.outputs.verbs }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$RELEASE_URL" > release.json && python - <<'PY'
          import json, os
          live = json.load(open("release.json"))
          got = {"git_sha": (live.get("git_sha") or {}).get("value"),
                 "worker_version": (live.get("worker_version") or {}).get("id"),
                 "env": (live.get("env") or {}).get("value"),
                 "verb_count": str(live.get("verb_count"))}
          want = {"git_sha": os.environ["SHA"], "worker_version": os.environ["VERSION_ID"],
                  "env": "production", "verb_count": os.environ["VERBS"]}
          print(json.dumps(got))
          raise SystemExit(0 if got == want else 1)
          PY
            then
              echo "production /release serves $SHA as version $VERSION_ID with $VERBS verbs"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$RELEASE_URL did not report git_sha $SHA, version $VERSION_ID, env production and $VERBS verbs within two minutes."
          exit 1
