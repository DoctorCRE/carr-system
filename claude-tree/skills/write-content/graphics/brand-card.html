<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  CARR / Joe Bookout brand-card template (write-content graphic engine: "code card").
  Rebuilt July 12, 2026 to the editorial layout that actually ships: CARR wordmark top-left,
  orange CAPS kicker, optional big stat, headline, an accent bar measured to WHOLE WORDS
  (never stops mid-word), a readable source line, and a one-line credit footer.
  Edit only the DATA block. Supports a duotone photo backdrop (bgImage), an optional data ring,
  and an optional paw motif (veterinary). Renders 1080x1080 by default; override via DATA.width/height.
  Render: chrome --headless=new --use-mock-keychain --password-store=basic --force-device-scale-factor=2 --window-size=WIDTH,HEIGHT+200
  --screenshot=raw.png ; then crop top-left to exactly (2*WIDTH x 2*HEIGHT).
-->
<style>
  @font-face{font-family:'OswaldBrand';src:url('./fonts/Oswald.ttf');font-weight:200 700;font-display:swap;}
  @font-face{font-family:'MontserratBrand';src:url('./fonts/Montserrat.ttf');font-weight:300 800;font-display:swap;}
  :root{--navy:#002F6C;--navy-deep:#00224D;--orange:#F57F29;--white:#FFFFFF;
    --head:'OswaldBrand','Oswald','Archivo Narrow',sans-serif;
    --body:'MontserratBrand','Montserrat','Helvetica Neue',Arial,sans-serif;
    --hsize:73px;--statsize:196px;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  html,body{background:#00224D;}
  #card{position:relative;overflow:hidden;display:flex;flex-direction:column;
    padding:72px 76px 64px;color:var(--white);
    background:radial-gradient(120% 90% at 82% 8%,#063a82 0%,var(--navy) 46%,var(--navy-deep) 100%);}
  #bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;display:none;}
  #bgtint{position:absolute;inset:0;z-index:1;display:none;
    background:linear-gradient(157deg,rgba(0,34,77,.90) 0%,rgba(0,40,92,.82) 46%,rgba(0,34,77,.93) 100%);}
  #bgtint::after{content:"";position:absolute;left:0;right:0;bottom:0;height:48%;
    background:linear-gradient(to top,rgba(0,20,48,.90) 0%,rgba(0,20,48,0) 100%);}
  body.has-bg #bg,body.has-bg #bgtint{display:block;}
  #ring{position:absolute;right:-150px;bottom:-180px;width:820px;height:820px;border-radius:50%;z-index:1;
    background:conic-gradient(from 200deg,var(--orange) 0deg 176deg,rgba(255,255,255,.12) 176deg 360deg);
    -webkit-mask:radial-gradient(circle,transparent 57%,#000 60%);mask:radial-gradient(circle,transparent 57%,#000 60%);
    opacity:.17;display:none;}
  #paw{position:absolute;right:-40px;bottom:-30px;width:600px;height:600px;z-index:1;opacity:.15;fill:var(--orange);display:none;}
  .layer{position:relative;z-index:2;}
  .wordmark{height:56px;width:auto;display:block;}
  .kicker{font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.15em;
    font-size:31px;color:var(--orange);margin-top:44px;}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .stat{font-family:var(--head);font-weight:700;font-size:var(--statsize);line-height:.9;letter-spacing:-.01em;color:var(--orange);}
  .statsub{font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    font-size:33px;color:rgba(255,255,255,.92);margin-top:16px;max-width:20em;}
  .headline{font-family:var(--head);font-weight:600;font-size:var(--hsize);line-height:1.12;margin-top:52px;}
  .accentbar{height:9px;background:var(--orange);border-radius:2px;margin-top:28px;width:120px;}
  #measure{position:absolute;visibility:hidden;white-space:nowrap;font-family:var(--head);font-weight:600;font-size:var(--hsize);}
  .source{font-family:var(--body);font-weight:500;font-size:29px;line-height:1.45;margin-top:34px;max-width:19em;color:rgba(255,255,255,.90);}
  .foot{margin-top:44px;font-family:var(--body);font-weight:600;font-size:26px;letter-spacing:.01em;color:rgba(255,255,255,.86);}
  .foot .dot{color:var(--orange);margin:0 12px;font-weight:700;}
  .foot .sub{color:rgba(255,255,255,.66);font-weight:500;}
</style>
</head>
