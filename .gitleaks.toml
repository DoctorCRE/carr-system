title = "CARR secret detection"

[extend]
useDefault = true

[[rules]]
id = 'carr-aws-access-key'
description = 'CARR aws-access-key parity'
regex = '''\bA[K]IA[0-9A-Z]{16}\b'''

[[rules]]
id = 'carr-google-api-key'
description = 'CARR google-api-key parity'
regex = '''\bAIza[0-9A-Za-z\-_]{35}\b'''

[[rules]]
id = 'carr-google-oauth-client-secret'
description = 'CARR google-oauth-client-secret parity'
regex = '''\bGOCSPX-[0-9A-Za-z\-_]{28}\b'''

[[rules]]
id = 'carr-github-token'
description = 'CARR github-token parity'
regex = '''\bgh[pousr]_[A-Za-z0-9]{36}\b'''

[[rules]]
id = 'carr-slack-token'
description = 'CARR slack-token parity'
regex = '''\bxox[baprs]-[0-9A-Za-z-]{10,}\b'''

[[rules]]
id = 'carr-anthropic-key'
description = 'CARR anthropic-key parity'
regex = '''\bsk-ant-[A-Za-z0-9\-_]{20,}\b'''

[[rules]]
id = 'carr-openai-key'
description = 'CARR openai-key parity'
regex = '''\bsk-(?:proj-)?[A-Za-z0-9]{32,}\b'''

[[rules]]
id = 'carr-dsn-with-password'
description = 'CARR dsn-with-password parity'
regex = '''\bpostgres(?:ql)?[:]//[^\s:/@]+:[^\s@]{6,}@'''

[[rules]]
id = 'carr-private-key-header'
description = 'Private key headers, including incomplete blocks'
regex = '''-----BEGIN (?:PRIVATE KEY|RSA PRIVATE KEY|EC PRIVATE KEY|DSA PRIVATE KEY|ENCRYPTED PRIVATE KEY|OPENSSH PRIVATE KEY|PGP PRIVATE KEY|PGP PRIVATE KEY BLOCK)-----'''

[[allowlists]]
description = "Reviewed synthetic fixture or non-secret source expression"
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)\.github/workflows/main\-canary\.yml$''']
regexes = [
  '''^\ \ \ \ \ \ \ \ \ \ CARR_CI_DATABASE_URL:\ \$\{\{\ \(contains\(matrix\.classes,\ 'unit'\)\ \|\|\ matrix\.classes\ ==\ 'migration'\)\ \&\&\ 'postgres[:]//carr_ci:postgres@127\.0\.0\.1:5432/carr_ci'\ \|\|\ ''\ \}\}\ \#\ ci\-secret\-scan:\ allow\ —\ throwaway\ container\ credential,\ loopback\ only,\ dies\ with\ the\ runner$''',
]

