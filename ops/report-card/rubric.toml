# ---------------------------------------------------------------------------
# METRICS — the mechanical half.
#
# EVERY ROW MUST CARRY (scope item 2 + rule 590b11e1 + rule a9ecd5b4):
#   key              stable id
#   category         which category it scores
#   question         the plain-English thing it answers
#   source_command   the literal command. $HEALTH and $CHECK point at the
#                    captured stdout of run.sh health / check, run ONCE per
#                    audit and reused — the audit reads the daily code's output
#                    rather than re-deriving it.
#   measured_from    what the number is physically counted from. Rule a9ecd5b4's
#                    corollary: an instrument goes on printing a confident figure
#                    long after the thing it measures stopped being the thing you
#                    care about, and naming the substrate is what catches that.
#   threshold        warn / fail
#   bound_action     what a crossed threshold TRIGGERS. A metric for which no
#                    response can be defined is not collected. No exceptions —
#                    this is the constraint that binds at build time.
#   added_on         / retired_on
#   independent_command  OPTIONAL second path to the same number, for the
#                    measurement-integrity sampler. Rows carrying one are the
#                    only rows that can ever be cross-checked, so prefer adding it.
#
# SEEDED SET ONLY. These rows exist to prove the mechanism executes end to end;
# the full per-lane set is written after the redteam settles the category list.
# ---------------------------------------------------------------------------

[[metric]]
key            = "facade_stale_rows"
source_mode    = "recovery"
category       = "automation_safety"
dimension      = "staleness"
question       = "How many watched outputs are stale right now?"
source_command = "awk '/^Façade check/,/^Schedule drift/' \"$HEALTH\" | grep -cE '⚠︎|MISSING' || true"
measured_from  = "run.sh health's façade-check SECTION ONLY — file mtimes against each row's declared cadence"
threshold      = { warn = 3, fail = 6 }
bound_action   = "Open/update ONE deduplicated loop (domain system, owner Joe/Claude) naming each stale row and its cadence source. Verification: the row reads OK on the next run.sh health. Auto-clears when the count returns under warn."
added_on       = "2026-08-09"
independent_command = "awk '/^Façade check/,/^Schedule drift/' \"$HEALTH\" | grep -cE 'STALE|MISSING' || true"
note = """
RECOVERY-ONLY AS OF 2026-08-17. This metric keeps its historical key and trend
only when an operator explicitly measures the noncanonical Drive projection.
Canonical health uses canonical_health_findings_v1 below; the two series must
never be compared or averaged because their substrates and denominators differ.

SECTION-SCOPED ON PURPOSE, and this row is its own worked example. The first
draft counted every '⚠︎' in the whole health output and returned 13 — it was
silently summing façade staleness, schedule drift, six deprecation rows and a
machine-config row into one number labelled "stale outputs". The true façade
count is 5. Nothing about the value 13 looked wrong; only comparing it against
measured_from caught it, which is the entire argument for that field.
LIMITATION, stated rather than hidden: the independent path counts a DIFFERENT
TOKEN in the SAME render, so it catches a parsing or scoping error (which is
what bit this row) but NOT an error inside health itself. A truly independent
path re-stats the watched files against the WATCH cadences. That is the right
version and it is not written yet.
"""

[[metric]]
key            = "canonical_health_findings_v1"
source_mode    = "canonical"
category       = "automation_safety"
dimension      = "staleness"
question       = "How many canonical record, Control Plane, doctrine, rule, registry, or repository findings are active?"
source_command = "grep -c '^  CANONICAL_FINDING ' \"$HEALTH\" || true"
measured_from  = "versioned canonical-record-control-v1 findings emitted by run.sh health from export_run, ops job/receipt ledgers, doctrine/rule controls, v_export_leads, and committed Git state"
threshold      = { warn = 1, fail = 3 }
bound_action   = "Name each CANONICAL_FINDING by key and repair its canonical source. Verification: the exact finding is absent from a fresh canonical health capture."
added_on       = "2026-08-17"
note           = "Fresh baseline. It does not carry facade_stale_rows history because file-mtime projection staleness and canonical ledger findings are different measurements."

[[metric]]
key            = "export_deadman_failures"
category       = "automation_safety"
dimension      = "staleness"
question       = "Did every registered export target succeed inside its dead-man window?"
source_command = "grep -cE '⚠︎ (STALE|NEVER RAN|NEVER OK|LATEST FAILED) ' \"$HEALTH\" || true"
measured_from  = "health's export dead-man lines, which it emits one per failing target from the record layer's per-target last-success timestamps"
independent_command = "grep -cE '^  OK [0-9]+ registered target\\(s\\)' \"$HEALTH\" | sed 's/1/0/' || true"
note = """
THIRD REWRITE, AND THE BUG CLASS IS THE LESSON. This row has now been wrong in
three distinct ways inside one session, every one of them a mismatch between
what the command reads and what `measured_from` claims:

  v1: `grep -oE '[0-9]+ registered target\\(s\\)'` — returned the INVENTORY SIZE
      (45) against fail=3. Permanently catastrophic when healthy, and EMPTY when
      a target actually failed, because health only prints that summary line when
      nothing is broken. It flagged RUBRIC DRIFT at the exact moment exports were
      dropping. Four red-team seats found it independently.
  v2: an awk range over the section — swallowed every row printed AFTER the
      export block under the same heading (R2 quota, corpus mirror, machine
      config, rules-live, forgetting, renders-verify) and reported the machine
      config drift as an export failure.
  v3, this one: anchored on the FAILURE TOKENS health actually emits per failing
      target — `⚠︎ STALE <key>`, `⚠︎ NEVER RAN <key>`, `⚠︎ NEVER OK <key>`, or
      `⚠︎ LATEST FAILED <key>`. The
      trailing space matters: the façade section prints `⚠︎ <name>  STALE 13.0d`,
      name first, so it cannot collide.

THE GENERALISABLE PART: a section-range anchor is fragile because it depends on
what comes after it, which nobody controls. A token anchor depends only on what
the producer emits for the thing being counted. Prefer the token. And the reason
all three versions passed `--validate` is that `measured_from` is free text
nothing verifies — a substrate probe that proves the named source was the one
read is the real fix, and it is not built yet.
"""
threshold      = { warn = 1, fail = 3 }
bound_action   = "Name the failing target and its exporter; open a loop with the re-export command. Verification: the target reports a success inside 26h."
added_on       = "2026-08-09"

[[metric]]
key            = "code_drift_rows"
source_mode    = "recovery"
category       = "system_development"
dimension      = "staleness"
question       = "How many repo files have drifted from their live vault copy?"
source_command = "grep -c 'DRIFT' \"$CHECK\" || true"
measured_from  = "check.sh's byte diff of each manifest.tsv row, repo vs vault"
threshold      = { warn = 1, fail = 5 }
bound_action   = "Per drifted row, decide which side is canonical and reconcile; drift that is intentional gets a manifest note. Verification: check.sh reports OK for that row."
added_on       = "2026-08-09"
note           = "RECOVERY-ONLY AS OF 2026-08-17. This preserves the historical repo-vs-live-Drive series. Canonical runs use canonical_repo_worktree_drift_v1; trends do not carry between them."

[[metric]]
key            = "canonical_repo_worktree_drift_v1"
source_mode    = "canonical"
category       = "system_development"
dimension      = "staleness"
question       = "How many manifest-tracked canonical repo paths differ from committed HEAD?"
source_command = "grep -c '^  DRIFT' \"$CHECK\" || true"
measured_from  = "check.sh's versioned canonical Git comparison of manifest-tracked repo paths against committed HEAD"
threshold      = { warn = 1, fail = 5 }
bound_action   = "Review and intentionally commit or revert each manifest-tracked worktree change. Verification: canonical check reports no DRIFT row for that path."
added_on       = "2026-08-17"
note           = "Fresh baseline. It cannot inherit code_drift_rows because that older metric compared the repo with a Drive runtime copy."

[[metric]]
key            = "doctrine_stale_sections"
category       = "governance"
dimension      = "staleness"
question       = "How many policy-bearing doctrine sections are past their review clock?"
source_command = "grep 'stale-sections' \"$HEALTH\" | grep -oE '[0-9]+ past review_after' | grep -oE '^[0-9]+' || echo 0"
measured_from  = "doctrine section review_after dates in the store"
threshold      = { warn = 1, fail = 5 }
bound_action   = "Review or re-confirm each via write-doctrine-section. Verification: the health row returns to 0."
added_on       = "2026-08-09"

[[metric]]
key            = "field_touch_coverage"
category       = "field_ingestion"
dimension      = "effectiveness"
question       = "What share of active deals carry a real last_touch?"
source_command = ""   # DELIBERATELY EMPTY — see note
measured_from  = "the record layer's deal rows"
threshold      = { warn = 50, fail = 25 }
bound_action   = "PENDING. Not collected until the command exists — rule 590b11e1 refuses a metric whose response is undefined, and this row is carried as an explicit gap rather than as a silent absence."
added_on       = "2026-08-09"
note           = "Aug 6 measured ~5% system-wide (36 of 38 active deals null). The number matters and the command does not exist yet; writing the row without the command is how v1 accumulated unmeasurable metrics, so this one is marked and left uncollected until the query is written."

