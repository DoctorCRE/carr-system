note = """
RESOLVED 2026-08-10 — scope item 9, the one conflict the red team left open.
The measurement scientist wanted this category STRENGTHENED (double-grading, an
agreement statistic); the taxonomy seat wanted it DEMOTED to a pass/fail gate.
Ruled: the conflict is mostly false, and the synthesis beats either seat.

KEEP the measurement scientist's MECHANISM — double-grading and a declared
agreement statistic are exactly the evidence that decides the question. CHANGE
what it feeds: this is a GATE, not a scored category that averages in.

WHY A GATE AND NOT A SCORE. Measurement integrity is a PRECONDITION for the
other categories, not a peer of them. Scored and averaged, a run with a corrupt
instrument still emits an authoritative overall number, diluted across thirteen
other cells — which is precisely what happened on 2026-08-06, where the
instrument was demonstrably broken and the run published 69 anyway. Worse, the
aggregation defect in scope item 2 is still open: the Aug 6 overall was an
unweighted mean and roughly 5 of the 19-point "collapse" was the averaging
function moving. Adding a fourteenth averaged cell whose whole subject is
instrument noise makes the aggregate MORE sensitive to instrument noise. Wrong
direction.

RULE 590b11e1 SETTLES IT INDEPENDENTLY. No metric without a bound action. Ask
what action "measurement_integrity: 72" binds and the answer is nothing — there
is no response defined for a 72. A FAIL binds exactly one unambiguous action:
the run does not publish a score. That is a real bound action, so the gate form
satisfies the rule the scored form cannot.

SCOPE, under rule f5bac101 and the empty chair of scope item 10 — this is a
two-person early-stage brokerage whose binding constraint is pipeline, not audit
fidelity. Double-grading all 34 cells is not affordable and is not warranted.
Double-grade only the LOAD-BEARING cells: the extremes, and anything that moved
more than one band since the last run. Precedent, and it is measured rather than
assumed: the Aug 6 run double-graded its six extreme grades with fresh-context
verifiers and overturned four of six. That hit rate justifies the spend on the
extremes and does not justify it on the settled middle.

THRESHOLD DELIBERATELY UNSET. The agreement number is NOT invented here. Rule
4fae20f4 — a rate is not a baseline until you check what else is in the window,
and nobody has yet observed the natural spread between two graders on this
rubric. The dry run (loop #264, 2026-08-25) sets it from observed spread, and
until it is set this gate collects and REPORTS agreement without blocking. A
threshold picked from nothing would be the same unfalsifiable number the whole
rebuild exists to remove.

THE TWO STANDING JOBS, unchanged by the demotion:
  (a) SAMPLE AND RE-DERIVE. Each run picks a random sample of metrics carrying
      an independent_command and re-derives them by a second path, then compares.
      The worked example is real: on 2026-08-06 the T1 measure agent reported
      working-brain at 22,752 KB by counting .md.generations rotation folders;
      the true figure was 5,187 KB. Nothing in the instrument caught that — a
      human did, afterwards.
  (b) GRADE THE INSTRUMENT ITSELF. A metric whose source_command exits non-zero,
      or whose value cannot be parsed, on two consecutive runs is reported as
      RUBRIC DRIFT rather than silently returning "unmeasurable". This is the
      mechanism v1 never had, and its absence is the deepest cause of the
      rebuild: a rubric with no drift detector buys exactly one month.

THIRD JOB ADDED BY THE 2026-08-10 FIRING, and it is the same failure class as
(a). The monthly gate in audit-task.md decided "has this month's audit already
run" by grepping a RENDER of decision-history, which had since become a
size-budgeted window that drops same-month entries. The check could not see what
had scrolled past it, and only an unrelated hold stopped a double run. GENERAL
FORM, which this gate must enforce on itself: a check reads the ARTIFACT the
work produces, never a render of the log the work records to.
"""

