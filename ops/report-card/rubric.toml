# THE SYSTEM REPORT CARD — RUBRIC v2 (DRAFT, NOT ADOPTED)
#
# Loop #220. Joe's ruling 2026-08-06: "It feels like the audit is not even
# configured correctly anymore. The system is not even the same concept as it
# was when we created this audit."
#
# WHY THIS FILE EXISTS AT ALL, rather than a prose rubric inside a markdown card.
# v1's rubric lived in 00_Context/system-report-card-2026-07-07.md as English
# prose. That had three consequences, all of which actually happened:
#   1. The measure agent returned "unmeasurable" on 6 of ~20 rows and got 4 more
#      wrong, because the prose named retired stubs and retired technology and
#      nothing could tell it so.
#   2. The manual path and the fan-out path were different code (a human read
#      the prose; the workflow re-read the same prose and re-derived it), which
#      rule a8c55a47 forbids.
#   3. Nothing bound the rubric to the system: the card was written 2026-07-07,
#      the system changed daily, and no mechanism ever forced the rubric to
#      change with it. The drift was found by a human eleven months of
#      system-time later, not by the instrument.
# A spec that is DATA and whose every row carries an executable source command
# fixes all three: rows are checkable, one parser reads it (rule 73381d78), and
# a row whose command stops working is a signal on the very next run instead of
# a discovery next quarter.
#
# PLACEMENT (rule c1547ed1), stated because it was a real fork:
#   - THIS SPEC lives in the repo. It is code class — reviewed, diffable,
#     testable, and it is the same bytes the automated and manual paths read.
#   - THE RESULTS (scores, correctives, evidence) go to the DATABASE, not into
#     a markdown table. Rule 14181e60 and ca841807. v1's score history was a
#     markdown table that only a human could append, which is why the trend line
#     is six columns wide after a month and cannot be queried.
#   - THE CARD is a render of the two. Derived outputs land in the vault.
#
# THE SPEC IS NOT THE AUDIT. Everything here is the MECHANICAL half — the part
# that has a command and a number. The audit's actual job is the judgment half
# (see [meta].purpose), and judgment rows deliberately have no source_command.
#
# STATUS: DRAFT. Not adopted, not wired to the September run. The category set
# below is a starting position for the fresh-context redteam that loop #220
# requires before adoption (scope item 6) — it is deliberately NOT final, and
# the operator of the failed v1 instrument does not get to self-certify its
# successor.

[meta]
version           = "2.1.0-draft"
status            = "DRAFT — redteam gate open; not wired to any scheduled run"
supersedes        = "system-report-card-2026-07-07.md (v1: 12 categories + the bolted-on orchestrator lane)"
drafted_on        = "2026-08-09"
revised_on        = "2026-08-17"
evidence_contracts = ["canonical-record-control-v1", "drive-projection-recovery-v1"]
adopted_on        = ""            # stays empty until the redteam passes and Joe rules
dry_run_window    = "2026-08-25/2026-08-28"
first_production  = "2026-09-04"

# THE ANSWER TO "WHAT IS THE AUDIT FOR" — the first of the six questions the
# rebuild must settle before any category is written.
#
# JOE'S FRAMING, 2026-08-09, in his own words, and it is the one on the record:
#   "the audit is for assessing each of the categories of the system and scoring
#    them on performance, effectiveness, staleness, efficiency, and other
#    metrics. we want to track how the system is trending so we can address
#    disfunction or recognize greatness."
#
# It corrected the session's draft on two counts, both structural:
#   (a) SCORE ON NAMED DIMENSIONS. The draft gave each category a single 0-100
#       with no stated axis, which is exactly how a grader invents its own — and
#       is why v1's twelve scores were never comparable to each other. Joe names
#       the axes, so they are declared below and every metric maps to one.
#   (b) RECOGNIZE GREATNESS, not only dysfunction. The draft was entirely
#       deficit-shaped: the corrective flywheel tracks what is broken and nothing
#       recorded what was working. That is a real hole beyond morale — with no
#       record of a mechanism performing well, there is no baseline to notice its
#       EROSION against later (rule a6e6ab4e). The ledger therefore has two
#       halves now: correctives and standouts.
purpose = """
ASSESS EVERY CATEGORY, SCORE IT ON NAMED DIMENSIONS, AND TRACK THE TREND, so the
partners can address dysfunction or recognize greatness. That is Joe's framing
and it governs.

HOW THAT COEXISTS WITH THE DAILY CODE, because the two look like they overlap
and do not. run.sh health, check.sh, restore-rehearse and the it-support agent
answer IS ANYTHING BROKEN RIGHT NOW, comprehensively: 26 façade rows, schedule
drift, the deprecation register, a 45-target export dead-man, R2 quota, corpus
mirror, machine config, rules-live, forgetting, renders-verify, five
doctrine-store rows, plus code/video/twin-copy/output-hash drift.

THE AUDIT READS THAT OUTPUT AND SCORES IT. It does not re-derive it. Reading is
not re-measuring, and the distinction is the whole fix: v1's measure agent walked
the vault re-deriving numbers by hand and returned "unmeasurable" on 6 of ~20
rows while getting 4 more wrong. A staleness score now comes FROM health's own
staleness rows; the audit's contribution is the judgment about what that number
means over time, not the number.

So the audit produces four things nothing else can:
  1. TREND per category per dimension. Nothing else keeps a time series.
  2. INDEPENDENT JUDGMENT. health can say lead-board.html is 0.0d old. It cannot
     say the lead board is worth reading. Quality is not liveness.
  3. THE LEDGER, BOTH HALVES. Correctives graded DONE/PARTIAL/IGNORED against
     file-level evidence with escalation on two consecutive IGNOREDs — v1's own
     card calls this its healthiest mechanism and it carries over unchanged — AND
     standouts, which name what is performing excellently with the evidence, so
     it can be protected, replicated, and regressed against if it decays.
  4. COVERAGE OF THE UNWATCHED. A monitor only reports what it watches, so no
     monitor can report a subsystem that has no watcher. Finding those is work
     only an inventory-first pass does.
"""

# ---------------------------------------------------------------------------
# DIMENSIONS — Joe's axes, 2026-08-09. A category is scored on the dimensions it
# DECLARES, not on all of them: "staleness" is meaningless for Proven business
# outcomes, and forcing every category onto every axis is how a scorecard fills
# with rows nobody believes. 13 categories x 4 axes would be 52 scores; declaring
# per category keeps it honest and keeps the run tractable.
#
# sourced_from = "code"     → the number comes from health/check output. The
#                             grader interprets it; it never re-derives it.
#                "judgment" → no command can produce it. A grader argues it from
#                             evidence, and the fan-out's adversarial verifier
#                             checks the argument.
#                "mixed"    → a sourced number anchors a judgment call.
# ---------------------------------------------------------------------------

[[dimension]]
key          = "performance"
label        = "Performance"
sourced_from = "mixed"
question     = "Is this part of the system doing its job at the volume the business actually needs?"
note         = "Distinct from effectiveness: a lead board that rebuilds nightly with 9,857 rows PERFORMS. Whether any of those rows became a client is effectiveness."

[[dimension]]
key          = "effectiveness"
label        = "Effectiveness"
sourced_from = "judgment"
question     = "Is it producing the OUTCOME it exists for, or only the activity?"
note         = "The dimension v1 had no name for, and the reason Pipeline scored 62-68 for a month while ~9,857 pooled radar rows promoted to exactly zero leads. Activity looked fine. The outcome was nil."

[[dimension]]
key          = "staleness"
label        = "Staleness"
sourced_from = "code"
question     = "Is the material current, and did the thing that refreshes it actually run?"
note         = "Sourced entirely from run.sh health's façade and schedule-drift rows. The audit NEVER re-stats files — that re-derivation is precisely what v1 got wrong."

[[dimension]]
key          = "efficiency"
label        = "Efficiency"
sourced_from = "mixed"
question     = "What does this cost in tokens, human taps, and runtime for what it returns?"
note = """
CARRIES THE ONE GENUINELY BLOCKED INPUT. Loop #208's core-budget ruling (Aug 15
sweep) decides whether a size/token budget exists at all after the 2026-08-21
cutoff retires the .md renders. Until it rules, efficiency is scored on human
taps and runtime only, and no byte-budget metric is carried forward. v1's Token
efficiency 45/100 was measured against a 45 KB core budget where 67% of the bytes
were generated renders the sweep could not touch — the score measured the
instrument, not the system, and that row is tombstoned rather than inherited.
"""

