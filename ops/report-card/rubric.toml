# JUDGMENT ROWS — the half with no command, and the half that is the point.
#
# These are what the graders actually argue about. They are listed here so the
# rubric is honest that most of its weight is judgment, and so a grader is
# pointed at a question rather than left to invent one.
# ---------------------------------------------------------------------------

