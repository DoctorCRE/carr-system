schema_version: 1
job_types:
  feature-backend:
    read_only: false
    stages:
      shape:
        skills: []
        sizing_required: true
        sizes: [tiny, small, medium, large]
        conditional_skills:
          - skill: mattpocock-skills:grill-with-docs
            sizes: [medium, large]
      build:
        skills: ['pstack:poteto-mode', 'mattpocock-skills:tdd', 'pstack:principle-prove-it-works']
      pr:
        skills: [file-pr, 'mattpocock-skills:pr']
        card_line_required: true
      review:
        skills: ['mattpocock-skills:code-review']
        executor: independent_model
      fix-rounds:
        skills: [babysit-pr]
        conditional_skills:
          - skill: modernize
            when: main_changed
        main_update: merge
        max_rounds: 3
      ship:
        skills: []
        required_checks: green
        merge: auto
        pin_head: true
      close:
        skills: []
        outcomes:
          done: [slice_marked_done, pr_url]
          retired: [slice_retired, reason]
  feature-ui:
    read_only: false
    stages:
      shape:
        skills: []
        sizing_required: true
        sizes: [tiny, small, medium, large]
        conditional_skills:
          - skill: mattpocock-skills:grill-with-docs
            sizes: [medium, large]
      build:
        skills: ['pstack:poteto-mode', 'mattpocock-skills:tdd', 'pstack:principle-prove-it-works',
          'mattpocock-skills:codebase-design']
        screenshots:
          viewports: [phone, desktop]
          themes: [light, dark]
          coverage: cartesian_product
        taste_score:
          minimum: 7.5
          maximum: 10
      pr:
        skills: [file-pr, 'mattpocock-skills:pr']
        card_line_required: true
      review:
        skills: ['mattpocock-skills:code-review']
        executor: independent_model
      fix-rounds:
        skills: [babysit-pr]
        conditional_skills:
          - skill: modernize
            when: main_changed
        main_update: merge
        max_rounds: 3
      ship:
        skills: []
        required_checks: green
        merge: auto
        pin_head: true
      close:
        skills: []
        outcomes:
          done: [slice_marked_done, pr_url]
          retired: [slice_retired, reason]
  bug-fix:
    read_only: false
    stages:
      shape:
        skills: []
        sizing_required: true
        sizes: [tiny, small, medium, large]
        conditional_skills:
          - skill: mattpocock-skills:grill-with-docs
            sizes: [medium, large]
      build:
        skills: ['pstack:poteto-mode', 'mattpocock-skills:tdd', 'pstack:principle-prove-it-works',
          'mattpocock-skills:diagnosing-bugs']
        regression_test: fails_before_fix_passes_after
      pr:
        skills: [file-pr, 'mattpocock-skills:pr']
        card_line_required: true
      review:
        skills: ['mattpocock-skills:code-review']
        executor: independent_model
      fix-rounds:
        skills: [babysit-pr]
        conditional_skills:
          - skill: modernize
            when: main_changed
        main_update: merge
        max_rounds: 3
      ship:
        skills: []
        required_checks: green
        merge: auto
        pin_head: true
      close:
        skills: []
        outcomes:
          done: [slice_marked_done, pr_url]
          retired: [slice_retired, reason]
  removal-refactor:
    read_only: false
    stages:
      shape:
        skills: []
        sizing_required: true
        sizes: [tiny, small, medium, large]
        conditional_skills:
