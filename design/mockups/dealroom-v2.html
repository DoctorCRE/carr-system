<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Deal Room — dealroom.doctorcre.com · mockup v2</title>
<style>
  :root{
    --navy:#002F6C; --navy-deep:#00224D; --orange:#F57F29;
    --ink:#1A2333; --ink-2:#4A5568; --ink-3:#8B94A3;
    --paper:#F2E9D8; --card:#F7F0E1; --line:#E2D7C0;
    --amber:#B7791F; --amber-bg:#FDF3E3; --risk:#C0392B; --risk-bg:#FBEAE7;
    --good:#2E7D32; --good-bg:#E8F3E9;
    --dell:#5C7CA6; --joe:#002F6C;
    --ph1:#EEF2F8; --ph2:#D9E2EF; --ph3:#B9C9DE; --ph4:#8FA8C8; --ph5:#5C7CA6; --ph6:#33567F; --ph7:#002F6C;
    --r:10px; --rowH:44px; --fz:14.5px; --pad:14px;
    --disp:'Oswald','Arial Narrow',Impact,sans-serif;
    --body:'Montserrat','Avenir Next','Helvetica Neue',Arial,sans-serif;
    --ease:cubic-bezier(.22,.9,.35,1); --dur:.22s;
  }
  .night{
    --paper:#0E1B2E; --card:#13233B; --line:#24354F;
    --ink:#EAF0F8; --ink-2:#AEBDD2; --ink-3:#6E7F98;
    --amber:#E2B45A; --amber-bg:#2E2812; --risk:#E07B6B; --risk-bg:#3A1E1B;
    --good:#7BC488; --good-bg:#15301B;
    --dell:#8FA8C8;
    --ph1:#1A2C46; --ph2:#22375A; --ph3:#2C4670; --ph4:#3D5A8A; --ph5:#5C7CA6; --ph6:#8FA8C8; --ph7:#B9C9DE;
  }
  .dense{ --rowH:19px; --fz:11.5px; --pad:7px; --r:4px; }
  *{box-sizing:border-box; margin:0}
  body{font-family:var(--body); background:var(--paper); color:var(--ink);
       transition:background var(--dur) var(--ease); padding-bottom:56px}
  .reduce *{transition:none!important; animation:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--orange); outline-offset:2px}

  /* top bar */
  .top{position:sticky; top:0; z-index:50; background:var(--navy-deep); color:#fff;
       display:flex; align-items:center; gap:10px; padding:9px 16px; flex-wrap:wrap}
  .brand{font-family:var(--disp); letter-spacing:.07em; font-size:15px; text-transform:uppercase}
  .brand small{display:block; font:500 9.5px var(--body); letter-spacing:.04em; color:#8FA0B8; text-transform:none}
  .vibes{display:flex; gap:6px; margin-left:14px}
  .vibe{border:1.5px solid rgba(255,255,255,.3); background:transparent; color:#fff; cursor:pointer;
        padding:5px 13px; border-radius:999px; font:600 11.5px var(--body)}
  .vibe.on{background:var(--orange); border-color:var(--orange)}
  .vibe.cvd.on{background:#fff; color:var(--navy)}
  .vibe.ic{width:36px; padding:5px 0; text-align:center; font-size:14px}
  .sp{flex:1}
  .presence{display:flex; align-items:center; gap:6px}
  .av{width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
      font:700 11px var(--body); color:#fff; border:2px solid var(--navy-deep)}
  .av.joe{background:var(--joe); box-shadow:0 0 0 1.5px #fff}
  .av.dell{background:var(--dell); opacity:.35; transition:opacity .3s}
  .av.dell.here{opacity:1; box-shadow:0 0 0 2px var(--orange)}
  .mic{width:32px; height:32px; border-radius:50%; border:1.5px solid rgba(255,255,255,.4);
       background:transparent; cursor:pointer; font-size:14px; display:grid; place-items:center}
  .mic.on{background:var(--orange); border-color:var(--orange);
          box-shadow:0 0 0 4px rgba(245,127,41,.25); animation:micp 1.6s infinite}
  @keyframes micp{50%{box-shadow:0 0 0 7px rgba(245,127,41,.12)}}
  .demo{background:#fff; color:var(--navy); border:none; font:700 12px var(--body);
        padding:7px 15px; border-radius:999px; cursor:pointer}
  .demo.live{background:var(--orange); color:#fff}

  .wrap{max-width:1200px; margin:0 auto; padding:16px}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:6px 0 12px}
  .dense .stats{display:flex; gap:18px; margin:4px 0 8px}
  .tile{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:10px 14px}
  .dense .tile{padding:3px 0; border:none; background:none; display:flex; gap:6px; align-items:baseline}
  .tile b{display:block; font-family:var(--disp); font-size:24px; font-weight:600}
  .dense .tile b{font-size:15px; display:inline}
  .tile span{font-size:11px; color:var(--ink-2); letter-spacing:.04em; text-transform:uppercase}
  .dense .tile span{font-size:10px}
  .tile em{font-style:normal; color:var(--ink-2); font-weight:600; font-size:11px}

  .bar{display:flex; gap:7px; align-items:center; margin:0 0 10px; flex-wrap:wrap}
  .chip{border:1.5px solid var(--line); background:var(--card); color:var(--ink-2); border-radius:999px;
        padding:5px 13px; font:600 11.5px var(--body); cursor:pointer}
  .chip.on{background:var(--navy); border-color:var(--navy); color:#fff}
  .night .chip.on{background:var(--ph6); border-color:var(--ph6); color:var(--navy-deep)}
  .chip.delta.on{background:var(--good); border-color:var(--good)}
  .search{margin-left:auto; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
          border-radius:999px; padding:6px 14px; font:500 12.5px var(--body); width:190px}

  /* grid */
  .tframe{border:1px solid var(--line); border-radius:var(--r); background:var(--card);
          max-height:66vh; overflow:auto; overscroll-behavior:contain}
  .dense .tframe{max-height:none}
  table{width:100%; border-collapse:separate; border-spacing:0}
  thead th{font:600 10px var(--body); letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
           text-align:left; padding:8px var(--pad); border-bottom:1px solid var(--line);
           position:sticky; top:0; background:var(--card); z-index:5}
  .dense thead th{padding:4px var(--pad)}
  tbody td{padding:0 var(--pad); height:var(--rowH); font-size:var(--fz);
           border-bottom:1px solid var(--line); white-space:nowrap; position:relative}
  .dense tbody td{border-bottom-color:color-mix(in oklab, var(--line) 45%, transparent)}
  tbody tr:hover td{background:color-mix(in oklab, var(--card) 94%, var(--navy))}
  tr.attn td:first-child{box-shadow:inset 3.5px 0 0 var(--amber)}
  .cvd{--risk:#7B5CD6; --risk-bg:#EFE9FB; --amber:#8A6D00; --amber-bg:#F3ECD2; --good:#1B6E9C; --good-bg:#E2EFF6}
  .night.cvd{--risk:#B49CF0; --risk-bg:#2A2145; --amber:#E2C664; --amber-bg:#2E2812; --good:#7FC2E8; --good-bg:#14293B}
  body.cvd .ph{background-image:repeating-linear-gradient(135deg, transparent 0 5px, rgba(0,0,0,.07) 5px 7px)}
  .nightbody.cvd .ph{background-image:repeating-linear-gradient(135deg, transparent 0 5px, rgba(255,255,255,.09) 5px 7px)}
  .cvd .due.d7,.cvd .due.d2,.cvd .due.today{border:1.5px dashed currentColor}
  .cvd .due.over{border:1.5px double currentColor}
  .cvd .own{outline:1.5px solid var(--ink-3); outline-offset:1px}
  .cvd tr.attn td:first-child{box-shadow:none; border-left:3.5px dashed var(--amber)}
  tr.overdue td:first-child{box-shadow:inset 3.5px 0 0 var(--risk)}
  .cvd tr.overdue td:first-child{box-shadow:none; border-left:3.5px double var(--risk)}
  td.deal a{font-weight:600; color:var(--ink); text-decoration:none; cursor:pointer}
  td.deal a:hover{text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--orange)}
  .pic{display:inline-grid; place-items:center; width:22px; margin-right:7px; cursor:pointer; font-size:13px}
  .dense .pic{font-size:11px; width:16px; margin-right:4px}
  .ph{display:inline-block; padding:3px 10px; border-radius:999px; font:600 10.5px var(--body)}
  .dense .ph{background:none!important; padding:0; font:700 10px var(--body); color:var(--ink-2)!important; letter-spacing:.05em}
  .ph[data-p="On Deck"]{background:var(--ph1); color:var(--ink-2)}
  .ph[data-p="Research"]{background:var(--ph2); color:var(--ink-2)}
  .ph[data-p="Negotiation"]{background:var(--ph3); color:var(--ink)}
  .ph[data-p="Legal"]{background:var(--ph4); color:#fff}
  .ph[data-p="Diligence"]{background:var(--ph5); color:#fff}
  .ph[data-p="Closing"]{background:var(--ph6); color:#fff}
  .ph[data-p="Closed"]{background:var(--ph7); color:#fff}
  .night .ph[data-p="Closing"],.night .ph[data-p="Closed"]{color:var(--navy-deep)}
  .own{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%;
       font:700 10px var(--body); color:#fff}
  .dense .own{width:16px; height:16px; font-size:8.5px}
  .own.joe{background:var(--joe)} .own.dell{background:var(--dell)} .own.none{background:var(--line); color:var(--ink-3)}
  .night .own.joe{background:var(--ph6); color:var(--navy-deep)}
  td[contenteditable]{cursor:text}
  td[contenteditable]:focus{outline:none; box-shadow:inset 0 0 0 2px var(--orange); border-radius:4px}

  /* timeline badges (council ladder) */
  .due{font-size:11.5px; color:var(--ink-3)}
  .dense .due{font-size:10px}
  .due.d14{color:var(--ink-2)}
  .due.d7{color:var(--amber); font-weight:700}
  .due.d2,.due.today{background:var(--amber-bg); color:var(--amber); font-weight:700;
        padding:2.5px 9px; border-radius:999px}
  .due.over{background:var(--risk-bg); color:var(--risk); font-weight:700;
        padding:2.5px 9px; border-radius:999px}


  /* quick note */
  td.nextcell{display:flex; align-items:center; gap:6px; height:var(--rowH)}
  .nexttext{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; outline:none}
  .nexttext:focus{box-shadow:inset 0 0 0 2px var(--orange); border-radius:4px}
  .qn{opacity:0; border:none; background:none; cursor:pointer; font-size:13px; color:var(--ink-3); flex:0 0 auto}
  tr:hover .qn,.qn:focus{opacity:.85}
  .qnbox{position:absolute; inset:2px 4px; background:var(--card); border:2px solid var(--orange);
         border-radius:6px; display:flex; z-index:8}
  .qnbox input{flex:1; border:none; background:none; color:var(--ink); font:500 12.5px var(--body); padding:0 10px; outline:none}

  /* presence flag — the Excel convention, Joe's ruling */
  td.dellcell{box-shadow:inset 0 0 0 2px var(--dell); border-radius:4px}
  td.dellcell::before{content:"Dell"; position:absolute; top:-9px; left:8px; z-index:9;
      background:var(--dell); color:#fff; font:700 9px var(--body); letter-spacing:.05em;
      padding:1.5px 8px; border-radius:4px 4px 4px 0}

  .whisper{position:fixed; left:50%; transform:translateX(-50%) translateY(16px); bottom:64px; z-index:60;
           background:var(--navy-deep); color:#fff; font:500 12.5px var(--body);
           padding:8px 17px; border-radius:999px; opacity:0; pointer-events:none;
           transition:all .3s var(--ease); box-shadow:0 6px 24px rgba(0,20,50,.3)}
  .whisper.show{opacity:1; transform:translateX(-50%)}
  .whisper b{color:#fff}

  /* confirm strip (post-call distill — everything confirms, nothing auto-writes) */
  .confirms{position:fixed; left:0; right:0; bottom:0; z-index:55; background:var(--navy-deep);
            display:none; gap:10px; align-items:center; padding:9px 16px; overflow-x:auto}
  .confirms.show{display:flex}
  .confirms .lbl{color:#8FA0B8; font:600 10.5px var(--body); text-transform:uppercase; letter-spacing:.07em; white-space:nowrap}
  .cchip{background:#13233B; border:1px solid #2C4670; color:#EAF0F8; border-radius:10px;
         padding:7px 12px; font:500 12px var(--body); display:flex; gap:9px; align-items:center; white-space:nowrap}
  .cchip button{border:none; border-radius:7px; font:700 11px var(--body); padding:4px 10px; cursor:pointer}
  .cchip .y{background:var(--orange); color:#fff} .cchip .n{background:#24354F; color:#AEBDD2}

  /* deal page */
  #dealview{display:none}
  .dv-id{display:flex; align-items:center; gap:13px; margin:10px 0 2px}
  .dv-id .big{font-size:26px}
  .dv-id h1{font-family:var(--disp); font-weight:600; font-size:25px; letter-spacing:.03em}
  .back{border:none; background:none; color:var(--ink-2); font:600 12.5px var(--body); cursor:pointer; padding:8px 0}
  .back:hover{color:var(--ink)}
  .brief{display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:10px; margin:12px 0}
  .bcard{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px}
  .bcard h3{font:600 10px var(--body); letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px}
  .bcard .main{font-size:14.5px; font-weight:600}
  .bcard .sub{font-size:12px; color:var(--ink-2); margin-top:3px}
  .daterow{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0}
  .noterow{font-size:12.5px; padding:5px 0; border-bottom:1px dashed var(--line)}
  .noterow:last-child{border:none}
  .noterow .who{font-weight:700; font-size:10.5px; color:var(--ink-3); margin-right:7px}
  .fields{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);
          border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin:6px 0 14px}
  .f{background:var(--card); padding:10px 13px}
  .f label{display:block; font:600 9.5px var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
  .f div{font-size:13.5px; font-weight:600; margin-top:3px}
  .hist{font-size:12px; color:var(--ink-2)}
  .hist li{padding:4px 0; list-style:none; border-bottom:1px dashed var(--line)}
  .hist b{color:var(--ink)}
  .addnote{display:flex; gap:8px; margin-top:9px}
  .addnote input{flex:1; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
                 border-radius:8px; padding:8px 12px; font:500 13px var(--body)}
  .addnote button{background:var(--navy); color:#fff; border:none; border-radius:8px;
                  font:700 12px var(--body); padding:0 16px; cursor:pointer}
  h2.sec{font:600 11px var(--body); letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin:16px 0 7px}

  @media (max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr)}
    thead th:nth-child(3),tbody td:nth-child(3){display:none}
    .brief{grid-template-columns:1fr}
    .fields{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<div class="top">
  <span class="brand">The Deal Room<small>dealroom.doctorcre.com · mockup v2</small></span>
  <span class="vibes" title="Layout — what the room is">
    <button class="vibe lay on" data-lay="">Ledger</button>
    <button class="vibe lay" data-lay="dense">Dense</button>
  </span>
  <span class="vibes" style="margin-left:4px" title="Color — how it's lit; works in either layout">
    <button class="vibe col ic on" data-col="" title="Light" aria-label="Light scheme">☀️</button>
    <button class="vibe col ic" data-col="night" title="Dark" aria-label="Dark scheme">🌙</button>
    <button class="vibe cvd ic" data-col="cvd" title="Color assist — higher-distinction palette and patterns; works with light or dark" aria-label="Color assist">◐</button>
  </span>
  <span class="sp"></span>
  <div class="presence">
    <span class="av joe" title="Joe">J</span>
    <span class="av dell" id="dellAv" title="Dell">D</span>
    <button class="mic" id="mic" title="Quill — tap, or hold right-cmd anywhere">🎤</button>
  </div>

</div>

<div class="wrap">
  <div id="boardview">
    <div class="stats" id="stats"></div>

      <button class="chip on" data-f="all">All deals</button>

      <button class="chip" data-f="dell">Dell’s</button>
      <button class="chip" data-f="active">In motion</button>

      <input class="search" id="q" placeholder="Find a deal…" aria-label="Find a deal">
    </div>
    <div class="tframe"><table aria-label="Deal pipeline">
      <thead><tr>
        <th style="width:27%">Deal</th><th>Phase</th><th>Type</th>

      <tbody id="rows"></tbody>
    </table></div>
  </div>

  <div id="dealview"></div>
</div>

<div class="whisper" id="whisper"></div>

<div class="confirms" id="confirms">
  <span class="lbl">From your call · confirm or skip — nothing writes itself</span>
  <span class="cchip">Calloway → phase <b>Closed</b>?<button class="y">Yes</button><button class="n">Skip</button></span>

</div>

<script>
/* icon language — Joe's semantics, council-completed, "key it" ruling applied */
const PHICON = {"On Deck":"🔥","Research":"🔍","Negotiation":"🤝","Legal":"⚖️",
                "Diligence":"📋","Closing":"🔑","Closed":"✅"};
const TODAY = new Date('2026-08-08');
const data = JSON.parse(document.getElementById('board-data').textContent)
  .map((r,i)=>({id:i, deal:r[0], type:r[1], phase:r[2], own:r[3], touch:r[4],
                next:r[5], due:r[6], attn:false, changed:false,
                notes:[], history:[]}));
data[20].attn = true;                       // Okafor — Joe's example
data[13].notes = [["Joe","Lease commences Sep 1 — confirmed with landlord counsel"],
                  ["Dell","Kevin wants the benefit summary two weeks after move-in"]];
data[4].notes  = [["Dell","Landlord verbally agreed — signature chasing"]];
data[13].history = [["Joe","set next step → “Lease commences Sep 1”","2d ago"],
                    ["Joe","phase Negotiation → Legal","9d ago"],
                    ["Dell","added critical date Sep 1 commencement","9d ago"]];

const rowsEl=document.getElementById('rows'), whisper=document.getElementById('whisper');
let filter='all', q='';

function dueInfo(d){
  if(!d) return null;
  const days = Math.round((new Date(d)-TODAY)/864e5);
  const label = new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  if(days<0)  return {cls:'over',  txt:`OVERDUE ${-days}d`};
  if(days===0)return {cls:'today', txt:'TODAY'};
  if(days<=2) return {cls:'d2',    txt:`${label} · ${days}d`};
  if(days<=7) return {cls:'d7',    txt:`${label} · ${days}d`};
  if(days<=14)return {cls:'d14',   txt:`${label} · ${days}d`};
  return {cls:'',txt:label};
}
function icon(r){
  const d = r.due ? Math.round((new Date(r.due)-TODAY)/864e5) : 99;
  if(r.attn || d<0) return "⚠️";
  return PHICON[r.phase]||"○";
}
function render(){
  rowsEl.innerHTML='';
  const shown = data.filter(r=>{
    if(filter==='joe'&&r.own!=='joe') return false;
    if(filter==='dell'&&r.own!=='dell') return false;
    if(filter==='active'&&['Closed','On Deck'].includes(r.phase)) return false;
    if(filter==='delta'&&!r.changed) return false;
    if(q&&!r.deal.toLowerCase().includes(q)) return false;
    return true;
  });
  for(const r of shown){
    const tr=document.createElement('tr'); tr.dataset.id=r.id;
    const d = r.due ? Math.round((new Date(r.due)-TODAY)/864e5) : 99;
    if(r.attn) tr.classList.add('attn');
    if(d<0) tr.classList.add('overdue');
    const di = dueInfo(r.due);
    tr.innerHTML=`
      <td class="deal"><span class="pic" title="${r.phase}${r.attn?' · needs attention':''}">${icon(r)}</span><a data-open="${r.id}">${r.deal}</a></td>
      <td><span class="ph" data-p="${r.phase}">${r.phase}</span></td>
      <td style="color:var(--ink-2)">${r.type}</td>
      <td class="nextcell"><span contenteditable spellcheck="false" data-field="next" class="nexttext">${r.next}</span><button class="qn" data-note="${r.id}" title="Quick note on ${r.deal}">📝</button></td>
      <td>${di?`<span class="due ${di.cls}">${di.txt}</span>`:'<span class="due">—</span>'}</td>
      <td><span class="own ${r.own||'none'}">${r.own==='joe'?'J':r.own==='dell'?'D':'–'}</span></td>`;
    rowsEl.appendChild(tr);
  }
  if(filter!=='delta'){
    const jot=document.createElement('tr'); jot.className='jot';
    jot.innerHTML=`<td style="color:var(--ink-3)"><span class="pic" style="color:var(--orange)">+</span><span contenteditable data-ghost spellcheck="false" style="outline:none">Jot a deal — name, and go</span></td>
      <td><span class="ph" data-p="On Deck">On Deck</span></td><td></td>
      <td style="color:var(--ink-3)">next step…</td><td></td>
      <td><span class="own joe">J</span></td>`;
    rowsEl.appendChild(jot);
  }
  stats();
}
function stats(){
  const act=data.filter(r=>!['Closed','On Deck'].includes(r.phase)).length;
  const soon=data.filter(r=>{if(!r.due)return false; const d=Math.round((new Date(r.due)-TODAY)/864e5); return d>=0&&d<=7;}).length;
  const over=data.filter(r=>{if(!r.due)return false; return new Date(r.due)<TODAY;}).length;
  const closing=data.filter(r=>r.phase==='Closing').length;
  document.getElementById('stats').innerHTML=`
    <div class="tile"><b>${act}</b><span>Deals in motion</span></div>
    <div class="tile"><b>${closing}</b><span>At the key 🔑</span></div>
    <div class="tile"><b>${soon}</b><span>Dates this week</span></div>
    <div class="tile"><b>${over}</b><span>Overdue <em>· needs eyes</em></span></div>`;
}
function say(html){whisper.innerHTML=html; whisper.classList.add('show');
  clearTimeout(say.t); say.t=setTimeout(()=>whisper.classList.remove('show'),2600);}

/* attention toggles on icon click; edits save on Enter/blur */
rowsEl.addEventListener('click',e=>{
  const p=e.target.closest('.pic'); if(p&&p.closest('tr').dataset.id){
    const r=data[p.closest('tr').dataset.id]; r.attn=!r.attn; r.changed=true; render();
    say(`${r.attn?'Flagged':'Cleared'} <b>${r.deal}</b> ${r.attn?'⚠️ needs attention':''} — Dell sees it in a second`); return;}
  const o=e.target.closest('[data-open]'); if(o){openDeal(+o.dataset.open); return;}
  const n=e.target.closest('.qn'); if(n){quickNote(+n.dataset.note, n); return;}
});
rowsEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.hasAttribute('contenteditable')){e.preventDefault(); e.target.blur();}});
rowsEl.addEventListener('focusout',e=>{
  const td=e.target.closest?e.target.closest('[data-field="next"]'):null; if(!td) return;
  const tr=td.closest('tr'), r=data[tr.dataset.id];
  if(r&&td.textContent.trim()!==r.next){
    r.next=td.textContent.trim(); r.changed=true;
    say(`Saved — <b>${r.deal}</b> · you · just now · say undo to reverse`);}});
function quickNote(id, cell){
  const r=data[id]; const box=document.createElement('div'); box.className='qnbox';
  box.innerHTML=`<input placeholder="Quick note on ${r.deal} — Enter saves" autofocus>`;
  cell.closest('tr').querySelector('.nextcell').appendChild(box);
  const inp=box.querySelector('input'); inp.focus();
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'&&inp.value.trim()){r.notes.unshift(['Joe',inp.value.trim()]); r.changed=true;
      box.remove(); say(`Note on <b>${r.deal}</b> — in the record, visible on the deal page`);}
    if(ev.key==='Escape') box.remove();});
  inp.addEventListener('blur',()=>setTimeout(()=>box.remove(),150));
}

/* deal page — council D1 order */
function openDeal(id){
  const r=data[id]; const d=dueInfo(r.due);
  document.getElementById('boardview').style.display='none';
  const v=document.getElementById('dealview'); v.style.display='block';
  v.innerHTML=`
    <button class="back">← Back to the room</button>
    <div class="dv-id"><span class="big">${icon(r)}</span><h1>${r.deal}</h1>
      <span class="ph" data-p="${r.phase}">${r.phase}</span>
      <span class="own ${r.own||'none'}">${r.own==='joe'?'J':r.own==='dell'?'D':'–'}</span>
      ${d?`<span class="due ${d.cls}">${d.txt}</span>`:''}</div>
    <div class="brief">
      <div class="bcard"><h3>Next step</h3><div class="main">${r.next||'—'}</div>
        <div class="sub">owner: ${r.own?(r.own==='joe'?'Joe':'Dell'):'unassigned'} · last touch: ${r.touch||'—'}</div></div>
      <div class="bcard"><h3>Critical dates</h3>
        ${r.due?`<div class="daterow"><span>${r.deal===data[13].deal?'Lease commencement':'Next date'}</span><span class="due ${d.cls}">${d.txt}</span></div>`:'<div class="sub">none set — add one below</div>'}</div>
      <div class="bcard"><h3>Latest notes</h3>
        ${r.notes.length?r.notes.slice(0,2).map(n=>`<div class="noterow"><span class="who">${n[0]}</span>${n[1]}</div>`).join(''):'<div class="sub">no notes yet</div>'}</div>
    </div>
    <h2 class="sec">The facts</h2>
    <div class="fields">
      <div class="f"><label>Deal type</label><div>${r.type}</div></div>
      <div class="f"><label>Phase</label><div>${r.phase}</div></div>
      <div class="f"><label>Segment</label><div>${r.deal.includes('Pelvic')?'Healthcare':r.type==='Startup'?'—':'—'}</div></div>
      <div class="f"><label>Market</label><div>${r.deal.includes('Pelvic')?'Pensacola':'—'}</div></div>
    </div>
    <h2 class="sec">Notes</h2>
    ${r.notes.map(n=>`<div class="noterow"><span class="who">${n[0]}</span>${n[1]}</div>`).join('')||'<div class="sub" style="font-size:12px;color:var(--ink-3)">nothing yet</div>'}
    <div class="addnote"><input id="dvnote" placeholder="Add a note — or hold right-cmd and just say it"><button id="dvsave">Save</button></div>
    <h2 class="sec">History — every change, attributed</h2>
    <ul class="hist">${r.history.map(h=>`<li><b>${h[0]}</b> ${h[1]} <span style="color:var(--ink-3)">· ${h[2]}</span></li>`).join('')||'<li>created from the board</li>'}</ul>`;
  v.querySelector('.back').onclick=()=>{v.style.display='none';
    document.getElementById('boardview').style.display='block'; render();};
  v.querySelector('#dvsave').onclick=()=>{const i=v.querySelector('#dvnote');
    if(i.value.trim()){r.notes.unshift(['Joe',i.value.trim()]); r.changed=true; openDeal(id);
      say(`Note saved on <b>${r.deal}</b>`);}};
}

/* filters, search, vibes */
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); filter=c.dataset.f; render();
  if(filter==='delta') say('Δ — only what moved since your last call, straight off the event log');
}));
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.toLowerCase(); render();});
document.querySelectorAll('.vibe.lay').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.vibe.lay').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  document.body.classList.toggle('dense', b.dataset.lay==='dense');
}));
document.querySelectorAll('.vibe.col, .vibe.cvd').forEach(b=>b.addEventListener('click',()=>{
  if(b.classList.contains('cvd')){ b.classList.toggle('on'); document.body.classList.toggle('cvd'); return; }
  document.querySelectorAll('.vibe.col:not(.cvd)').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  document.body.classList.toggle('night', b.dataset.col==='night');
}));
document.getElementById('mic').addEventListener('click',()=>{
  const m=document.getElementById('mic'); const on=m.classList.toggle('on');
  say(on?'Quill listening — this is one of its three doors (right-cmd · menu bar · here)':'Quill off');});

/* the call, simulated — presence flag per Joe's Excel ruling, then confirms */
const S=[
  [400,()=>{dellAv.classList.add('here'); say('<b>Dell</b> joined the room');}],
  [1500,()=>{const tr=[...rowsEl.children].find(t=>t.dataset.id==='4');
    if(tr){tr.querySelector('.nextcell').classList.add('dellcell');
      tr.scrollIntoView({block:'center',behavior:'smooth'});}}],
  [3300,()=>{const r=data[4]; r.next='Signed! Commencement Oct 1'; r.due='2026-10-01';
    r.changed=true; render();
    say(`<b>Dell</b> updated Nina Calloway — landlord signed`);}],
  [5000,()=>{const r=data[19]; r.changed=true; const tr=[...rowsEl.children].find(t=>t.dataset.id==='19');
    if(tr) tr.querySelector('.nextcell').classList.add('dellcell');
    say('<b>Dell</b> is on Whitfield — his name rides the cell, Excel-style');}],
  [7200,()=>{document.getElementById('confirms').classList.add('show');
    say('Call ended — the distiller heard three things · nothing writes without a tap');}],
  [12500,()=>{dellAv.classList.remove('here');
    document.querySelectorAll('.dellcell').forEach(x=>x.classList.remove('dellcell'));
    demoBtn.classList.remove('live'); demoBtn.textContent='▶ Simulate the call';}],
];
let playing=false;
demoBtn.addEventListener('click',()=>{ if(playing) return; playing=true;
  demoBtn.classList.add('live'); demoBtn.textContent='● Live — watch the room';
  S.forEach(([t,f])=>setTimeout(()=>{f(); if(t===12500) playing=false;},t)); });
document.querySelectorAll('.cchip button').forEach(b=>b.addEventListener('click',e=>{
  const chip=e.target.closest('.cchip'); const yes=b.classList.contains('y');
  if(yes&&chip.textContent.includes('Calloway')){data[4].phase='Closed'; data[4].changed=true; render();}
  chip.remove(); say(yes?'Confirmed — written as you, reversible':'Skipped — nothing written');
  if(!document.querySelector('.cchip')) document.getElementById('confirms').classList.remove('show');
}));

render();
</script>
