# mypy.ini — the nightly type-check tripwire (added 2026-08-06, Joe's go).
# DELIBERATELY LENIENT: this is a tripwire for shape mistakes in data hand-offs,
# not a strictness project. Coverage densifies as sessions touch files; do not
# turn on strict flags wholesale — a wall of noise gets ignored, same lesson as
# the alarm-that-fires-every-day (nightly.sh ORDER 2 addendum).
[mypy]
python_version = 3.14
ignore_missing_imports = True
explicit_package_bases = True
check_untyped_defs = False
no_implicit_optional = True
warn_redundant_casts = True
# Generated/vendored/experimental code is not swept:
exclude = (?x)(^_to_delete/|^\.venv/|^vendor-patches/|^frozen-sources/|^corpus/)
